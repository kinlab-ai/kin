name: Release rehearsal
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      source_path:
        required: false
        type: string
        default: '.'
      release_tag:
        required: false
        type: string
        default: v0.8.6
      proof_mode:
        required: false
        type: string
        default: compatibility-baseline
      local_artifact:
        required: false
        type: string
        default: ''
permissions:
  contents: read
  attestations: read

# Every leg runs on Depot, as rc-build.yml does. The KIN_RC_USE_GITHUB_RUNNERS
# outage switch selects the GitHub-hosted runners instead. It changes no proof
# rule.
jobs:
  windows:
    uses: ./.github/workflows/release-rehearsal-windows.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      source_path: ${{ inputs.source_path }}
      release_tag: ${{ inputs.release_tag }}
      proof_mode: ${{ inputs.proof_mode }}
      local_artifact: ${{ inputs.local_artifact }}
  tooling:
    name: Rehearse release tooling
    runs-on: ${{ vars.KIN_RC_USE_GITHUB_RUNNERS == 'true' && 'ubuntu-latest' || 'depot-ubuntu-24.04-4' }}
    timeout-minutes: 15
    steps:
      - name: Require the workflow context candidate before checkout
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          CONTEXT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTEXT_SHA" =~ ^[0-9a-f]{40}$ || "$CANDIDATE" != "$CONTEXT_SHA" ]]; then
            echo "::error::Rehearsal candidate must equal the actual workflow context SHA"
            exit 1
          fi
      - name: Checkout the exact rehearsal source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: rehearsal-source
          fetch-depth: 1
          persist-credentials: false
      - name: Bind source and rehearse staged preflight imports
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          SOURCE_PATH: ${{ inputs.source_path }}
          BASELINE_TAG: ${{ inputs.release_tag }}
          PROOF_MODE: ${{ inputs.proof_mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "rehearsal-source/$SOURCE_PATH/scripts/release-rehearsal.py" bind \
            --source "rehearsal-source/$SOURCE_PATH" --candidate "$CANDIDATE" \
            --release-tag "$BASELINE_TAG" --mode "$PROOF_MODE"
          python "rehearsal-source/$SOURCE_PATH/scripts/release-rehearsal.py" imports \
            --source "rehearsal-source/$SOURCE_PATH" --candidate "$CANDIDATE" \
            --output "$RUNNER_TEMP/rehearsal/imports.json"
      - name: Run release authority with the live runner environment
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          python "rehearsal-source/$SOURCE_PATH/scripts/release-rehearsal.py" environment \
            --source "rehearsal-source/$SOURCE_PATH" --candidate "$CANDIDATE" \
            --output "$RUNNER_TEMP/rehearsal/environment.json"
      - name: Read the native runner handoff and record tooling evidence
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          SOURCE_PATH: ${{ inputs.source_path }}
          BASELINE_TAG: ${{ inputs.release_tag }}
          PROOF_MODE: ${{ inputs.proof_mode }}
        run: |
          set -euo pipefail
          node --version
          python "rehearsal-source/$SOURCE_PATH/scripts/release-rehearsal.py" record \
            --source "rehearsal-source/$SOURCE_PATH" --candidate "$CANDIDATE" \
            --release-tag "$BASELINE_TAG" --mode "$PROOF_MODE" --leg tooling \
            --output "$RUNNER_TEMP/rehearsal/tooling.json"
      - name: Preserve tooling rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-rehearsal-tooling
          path: ${{ runner.temp }}/rehearsal
          if-no-files-found: error
          retention-days: 30
  collect:
    name: Collect release rehearsal
    needs: [windows, tooling]
    runs-on: ${{ vars.KIN_RC_USE_GITHUB_RUNNERS == 'true' && 'ubuntu-latest' || 'depot-ubuntu-24.04-4' }}
    timeout-minutes: 10
    steps:
      - name: Require the workflow context candidate before checkout
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          CONTEXT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTEXT_SHA" =~ ^[0-9a-f]{40}$ || "$CANDIDATE" != "$CONTEXT_SHA" ]]; then
            echo "::error::Rehearsal candidate must equal the actual workflow context SHA"
            exit 1
          fi
      - name: Checkout the exact rehearsal source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: rehearsal-source
          fetch-depth: 1
          persist-credentials: false
      - name: Collect both rehearsal legs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: release-rehearsal-*
          path: ${{ runner.temp }}/rehearsal
          merge-multiple: true
      - name: Bind both passing legs to the exact candidate
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          SOURCE_PATH: ${{ inputs.source_path }}
          PROOF_MODE: ${{ inputs.proof_mode }}
        run: |
          set -euo pipefail
          python "rehearsal-source/$SOURCE_PATH/scripts/release-rehearsal.py" collect \
            --source "rehearsal-source/$SOURCE_PATH" --candidate "$CANDIDATE" \
            --directory "$RUNNER_TEMP/rehearsal" --mode "$PROOF_MODE"
      - name: Upload the candidate-bound rehearsal receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: kin-release-rehearsal
          path: ${{ runner.temp }}/rehearsal/rehearsal.json
          if-no-files-found: error
          retention-days: 90
