name: Secret Scan

# One producer of `gitleaks (full history)` per event, and each scans the
# history that event lands:
#
#   pull_request  the pull request's own commits, base..head, so every pull
#                 request, fork or not, gets the context in seconds;
#   merge_group   every commit reachable from the merge queue's commit, which
#                 is exactly the history main will hold if it lands;
#   push to main  every commit reachable from the pushed commit.
#
# Pushes to other branches no longer run it. They used to, because a
# same-repository pull request took this context from its branch push, and the
# merge queue's own `gh-readonly-queue/...` branch push would now publish a
# second copy of the context beside the `merge_group` run, which the release
# selector refuses as ambiguous.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Sha-scoped on main for the same reason as ci.yml: `cancel-in-progress: false`
# keeps at most one PENDING run per group and cancels the older one, so two
# quick pushes to main can delete the earlier commit's run outright. This
# workflow publishes `gitleaks (full history)`, a required context that
# release-tag.yml demands with push-event provenance, so a dropped run here
# makes the commit unmintable. The suffix is empty off main, leaving branch
# and merge-queue supersession exactly as it was.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # We invoke the gitleaks CLI directly instead of gitleaks/gitleaks-action.
      # The official action requires a (free) GITLEAKS_LICENSE secret for repos
      # owned by a GitHub *organization* (firelock-ai is one) and hard-fails
      # without it. The CLI has no such gate, so this keeps the scan green with
      # no extra secret to provision. The download is version-pinned and
      # checksum-verified for supply-chain safety.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "${BASE}/${TARBALL}"
          curl -fsSL -O "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$TARBALL" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Bounded to the commits this event lands. Without `--log-opts`, gitleaks
      # runs `git log --all`, and `fetch-depth: 0` fetches every branch, so a
      # scan of main or of the queue's commit also read every unrelated export
      # branch in the repository and failed on one of them. Exits non-zero when
      # any leak is found.
      - name: Scan the history this event lands
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            commits="${BASE_SHA}..${HEAD_SHA}"
          else
            git cat-file -e "${GITHUB_SHA}^{commit}"
            commits="${GITHUB_SHA}"
          fi
          echo "scanning $(git rev-list --count "$commits") commit(s): $commits"
          gitleaks git \
            --redact=100 \
            --verbose \
            --exit-code 1 \
            --log-opts="--full-history $commits" \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif" \
            .

      - name: Upload gitleaks SARIF report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore
