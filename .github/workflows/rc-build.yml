name: RC Build

# The only producer of the bytes a Kin release ships.
#
# This workflow builds the five release archives and the daemon image for one
# commit, installs every archive, smoke-tests the image, and attests all of
# them. release.yml compiles nothing. At a tag it locates the run of this
# workflow for the tagged commit (scripts/locate-rc-build.mjs), checks every
# binding that script lists, executes each archive again on a runner that can
# run it, signs and notarizes the two macOS archives, pushes the image, and
# publishes. The Linux and Windows archives and the image ship byte for byte as
# they were built here; the macOS archives differ only by their signatures.
#
# Why that is safe, and safer than what it replaced. The preflight in
# release-cut.yml has always judged THIS workflow's archives. release.yml used
# to compile the same commit again at the tag, so the Linux and Windows
# archives a user installed were a second build no preflight had judged. Now
# the archive a preflight leg judged is the archive that is published, and
# release.yml proves it by sha256 before anything ships. It also used to
# strand a tag whenever a release-only build failed, because a tag freezes
# release.yml; a build failure now happens here, before any tag exists.
#
# Two producers run it, and release.yml accepts bytes from no other:
#   - GitHub's merge queue, on `merge_group` for main. A merge group builds the
#     exact commit that then lands on main, so the tag minted for that commit
#     finds this run.
#   - Release Cut, by `workflow_dispatch` on release/v<version>-candidate, as
#     the fallback for a commit the queue did not build.
# A dispatch on any other branch still builds and proves a candidate for
# whoever asked for it.
#
# What it holds. The build, image and capability jobs declare no environment,
# read no secret and take no permission beyond `contents: read`. That keeps a
# dispatch of branch-controlled workflow code away from the Apple and
# package-publish credentials release.yml gates behind `environment: release`
# (see the note above `config` in release.yml). The attest job alone holds an
# OIDC token, to sign build provenance for the bytes the other jobs uploaded,
# and it checks out nothing and runs no repository code.
#
# No job here caches. A restored cache would put objects nobody reviewed into
# bytes that now ship, and no guard here could tell: "Verify native release
# build provenance" runs the binary and matches an embedded commit, which a
# poisoned object still reports correctly. Everything compiles cold.
#
# What a candidate archive is NOT:
#   - not signed and not notarized; release.yml signs the macOS archives.
#   - not a release, and its provenance manifest carries no release_tag.
#   - not public delivery proof. Each native archive is installed from this run
#     and checked against its exact source and component identities;
#     install-proof.yml proves the published release after it is public.
#
# scripts/check-rc-build-drift.mjs holds the contract between the two
# workflows: this one is the only workflow that compiles a release archive or
# builds the release image, release.yml takes exactly the artifacts this one
# uploads and compiles nothing, and both run the same native provenance check,
# scripts/verify-native-release-provenance.mjs.

on:
  # Every pull request the queue lands on main. The job conditions below keep a
  # queue for any other base branch out, so nothing but a main landing is built
  # on this event.
  merge_group:
    types: [checks_requested]
  # No ref input. `gh workflow run --ref <branch>` already names the ref, and the
  # run then resolves this workflow, the code it builds, and its cache scope from
  # that ref, the way a tag run resolves everything from its tag. Taking a ref as
  # an INPUT instead means a run started from the default branch checks out
  # arbitrary code while holding the default branch's scope, which is the cache
  # poisoning shape CodeQL flags as actions/cache-poisoning/poisonable-step.
  # The cost is that a candidate must be a branch or tag: the dispatch API does
  # not accept a bare sha.
  workflow_dispatch:

permissions:
  contents: read

# A candidate build is disposable, so a newer dispatch for the same ref
# supersedes an older one rather than queueing behind it. Every merge group has
# a ref of its own, so no group cancels another.
concurrency:
  group: kin-rc-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: RC Build (${{ matrix.artifact }})
    if: ${{ github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main' }}
    # An explicit outage switch selects only the reviewed native hosted row.
    # Unset or false keeps the measured Depot routes. It changes no build or
    # proof rule; slower candidates can use this workflow's 120-minute dispatch.
    runs-on: ${{ vars.KIN_RC_USE_GITHUB_RUNNERS == 'true' && matrix.github_os || matrix.os }}
    # A ceiling on a build that stops making progress, not a queue bound. In a
    # merge group it is 60: the whole run has to finish inside the merge
    # queue's 90-minute check window. The Windows leg measured 31 to 49
    # minutes on the standard runner (rc-build runs 38238857203, 38255291752
    # and 38334103441) and 18.6 on Depot, with the Depot macOS legs at 13 to
    # 21 and the Linux legs at 16 to 24. 60 for a build leg plus 15 for the
    # capability or attest job after it is 75 at worst. A
    # dispatched candidate keeps 120: the macOS arm64 leg reached the old
    # 90-minute bound on both 0.8.2 candidate attempts on the standard runner,
    # and a dispatch can still be sent to that pool for a measurement.
    timeout-minutes: ${{ github.event_name == 'merge_group' && 60 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One row per archive a release ships. scripts/locate-rc-build.mjs
          # names the same five, and scripts/check-rc-build-drift.mjs holds the
          # two lists and release.yml's shipping jobs equal. The two macOS
          # archives build on a Depot Apple Silicon runner. The x86_64 archive
          # is cross-compiled there and executed under Rosetta 2 by "Verify
          # native release build provenance", so its provenance is still proved
          # by running it, and release.yml runs it again natively on Intel.
          #
          # Measured on the same source, standard pool (rc-build run
          # 38238857203) against this runner (38255291752), which reported 9
          # CPUs and 17 GiB: the build step took 77 minutes there on each macOS
          # leg, and 20.7 here for arm64 and 12.1 for x86_64, with no swap and
          # the kernel's memory pressure at normal throughout. The arm64 leg
          # still links one binary at a time. Linking both at once took 12.4
          # minutes (38255295674) but compressed 8.3 GB and raised the pressure
          # level to warning, and the linux-aarch64 leg, whose build step takes
          # 23 to 24 minutes, sets this workflow's critical path either way.
          #
          # This is a paid, third-party pool, and the macOS bytes it builds are
          # now the macOS bytes that ship once release.yml signs them. It runs
          # before any tag exists, so a pool that stops assigning runners only
          # delays a candidate; it can no longer strand a tag, because
          # release.yml builds nothing. The release workflow authority suite
          # admits this label for this job only. The capability job below still
          # installs every archive on the standard pool's native hardware,
          # Intel included.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: kin-linux-x86_64
            cross: false
            github_os: ubuntu-latest
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: kin-linux-aarch64
            cross: false
            github_os: ubuntu-24.04-arm
          - os: depot-macos-26
            target: x86_64-apple-darwin
            artifact: kin-macos-x86_64
            cross: false
            github_os: macos-15-intel
          - os: depot-macos-26
            target: aarch64-apple-darwin
            artifact: kin-macos-aarch64
            cross: false
            github_os: macos-latest
          # The Windows archive builds on a 16-core Depot Windows runner, on
          # the same terms as the macOS rows above. On the standard 4-vCPU
          # windows-latest runner its build step took 39 to 49 minutes and set
          # this workflow's critical path. About 9 of those compile the crates
          # and the rest is the two fat-LTO links, each on one thread. Measured
          # once per size on the same source, the step took 18.6 minutes here
          # and 18.3 on 32 cores, so more cores no longer help. The two links
          # held about 12 GB resident together and took the machine's commit to
          # about 17 GB, past the standard runner's 16 GB of RAM, which is the
          # likely reason they ran so much slower there. This is the Windows
          # Server 2022 image while windows-latest is Server 2025, and the
          # capability job below still installs and runs the archive on
          # windows-latest.
          - os: depot-windows-2022-16
            target: x86_64-pc-windows-msvc
            artifact: kin-windows-x86_64
            cross: false
            github_os: windows-latest

    steps:
      - name: Preserve tracked bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # A candidate has no tag to take a version from, and both the macOS
      # notifier bundle and the provenance manifest need one. The workspace
      # package version is what the built binaries stamp into their own static
      # build identity, so it is the only value those identities can agree with.
      - name: Resolve the release-candidate identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e '
            const fs = require("fs");
            let inSection = false;
            let version = null;
            for (const line of fs.readFileSync("Cargo.toml", "utf8").split("\n")) {
              const header = line.match(/^\s*\[([^\]]+)\]/);
              if (header) { inSection = header[1] === "workspace.package"; continue; }
              if (!inSection) continue;
              const found = line.match(/^\s*version\s*=\s*"([^"]+)"/);
              if (found) { version = found[1]; break; }
            }
            if (!version) throw new Error("Cargo.toml carries no [workspace.package] version");
            process.stdout.write(version);
          ')"
          # Refuse rather than default. A version read that silently returned
          # something unversion-shaped would surface later as a static build
          # identity mismatch attributed to the binaries.
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::resolved release-candidate version '$version' is not semver-shaped"; exit 1 ;;
          esac
          {
            echo "RC_VERSION=$version"
            echo "RC_REF=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          echo "release candidate $version at $(git rev-parse HEAD)"

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}

      # An x86_64 macOS archive built on an Apple Silicon runner is executed by
      # "Verify native release build provenance", and Rosetta 2 is what lets an
      # arm64 host run x86_64 code. It is installed and proved here, before the
      # compile, so a host that cannot run the archive fails in seconds rather
      # than after the link. On every other leg this step does nothing.
      - name: Install Rosetta 2 (x86_64 macOS on Apple Silicon)
        if: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.target == 'x86_64-apple-darwin' }}
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta 2 is already installed"
          else
            sudo -n /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true
          echo "x86_64 code runs on this $(uname -m) host under Rosetta 2"

      # musl-static C dependencies (ring, oniguruma, sqlite, tree-sitter) need a
      # musl-targeting C compiler; musl-tools provides musl-gcc. Only the Linux
      # musl legs require it.
      #
      # Bounded through the shared helper rather than called directly. A bare
      # `apt-get update && apt-get install` has no ceiling below the job
      # timeout: the hosted mirrorlist puts azure.archive.ubuntu.com first and a
      # stall there trickles bytes slowly enough that no per-fetch timeout
      # fires. The helper bounds each call, retries three times, and fails over
      # to archive.ubuntu.com from the second attempt, so a stalled mirror ends
      # the step with its own error line instead of holding a release build.
      - name: Install musl C toolchain (Linux musl)
        if: ${{ contains(matrix.target, '-linux-musl') }}
        run: ./scripts/ci-apt-install.sh musl-tools

      - name: Install cross (ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Verify canonical release input bytes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const childProcess = require("child_process");
          const crypto = require("crypto");
          const fs = require("fs");

          const sha256 = (bytes) =>
            crypto.createHash("sha256").update(bytes).digest("hex");
          const tracked = childProcess.execFileSync(
            "git",
            ["cat-file", "blob", "HEAD:Cargo.lock"],
          );
          const working = fs.readFileSync("Cargo.lock");
          if (!working.equals(tracked)) {
            throw new Error(
              `Kin Cargo.lock working bytes ${sha256(working)} do not match ` +
              `tracked Git bytes ${sha256(tracked)}; refusing release provenance`
            );
          }
          console.log(`Verified canonical Kin Cargo.lock bytes: ${sha256(tracked)}`);
          NODE

      - name: Assert clean release source
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty" >&2
            echo "::error::release checkout is not clean before compilation"
            exit 1
          fi

      - name: Build kin-cli + kin-daemon (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          # The daemon is the runtime: `kin init` works without it but
          # `kin status`/`kin search`/the MCP server all require kin-daemon on
          # PATH, so a clean public install must ship it alongside `kin`.
          #
          # Every platform now builds the same default feature set. Windows was
          # the only leg that stripped it, and dropping that split is what puts
          # native vector search in the shipped Windows archive.
          #
          # The Linux legs are given swap and then sample their own memory and
          # disk into this step's own log while cargo runs. Both halves stay
          # here permanently, because the second is what proves the first is
          # still enough. macOS grows its own swap files and offers no swapfile
          # to add, so the macOS legs only sample, recording free memory, the
          # compressor, swap in use and the kernel's pressure level.
          #
          # What this leg ran out of, measured rather than guessed. The
          # linux-aarch64 leg of v0.7.14 died at this step on all three attempts
          # of run 34579776198 with "The runner has received a shutdown signal"
          # and exit code 143, and the step log carried no resource numbers at
          # all. Re-running the same build on main's head under the sampler
          # (rc-build run 34642288259, job 103404693178) reproduced it exactly
          # and said why. Free disk never moved: 108,661 MB on every one of the
          # 55 samples, with the whole build consuming 1.9 GB. Memory went one
          # way. The largest rustc climbed from 4,287 MB to 7,789 MB while
          # available memory fell from 6,602 MB to 253 MB, the kernel then ate
          # the image's own 3 GB swapfile to nothing by 20:18:51Z, and the
          # runner was torn down thirteen seconds later, still climbing. The
          # runner has 15,947 MB of RAM, so the peak needs more than the roughly
          # 19 GB of RAM plus swap that the image ships with.
          #
          # Why the peak is that big: cargo links kin-cli and kin-daemon in one
          # invocation, and the release profile is fat LTO with one codegen
          # unit, so the peak is two whole-program links of a large Rust binary
          # resident at once. The largest single process was 7.8 GB while total
          # commitment was about 19 GB, which is that shape. Thin LTO on one
          # architecture would change what ships and the release notes would
          # have to say so, and the runner label is a cost decision rather than
          # an engineering one, so the leg is given memory instead.
          #
          # Both Linux legs get it rather than the arm row alone, and the
          # x86_64 leg's own samples from that same run are why the distinction
          # is not worth a guard. It succeeded on an identically sized runner,
          # 15,988 MB of RAM and the same 3 GB swapfile, with its largest rustc
          # peaking at 4,193 MB, 5,006 MB still available and swap never
          # touched. So the same fat-LTO build of the same crates costs roughly
          # 1.9 times the peak resident set on aarch64 that it costs on x86_64,
          # which is a property of the backend rather than of what is being
          # built. The x86_64 leg has headroom today and its swap is insurance;
          # keying the headroom to an architecture would record the accident of
          # which leg crossed first rather than the reason either might.
          #
          # The macOS arm64 leg is the one that outgrew its runner, and it is
          # given the two links one at a time rather than more memory. The
          # standard Apple Silicon runner has 3 cores and 7 GB of RAM. On the
          # 0.8.2 candidate (rc-build run 38192967949) the linux-aarch64 leg,
          # same crates and same backend, fell to 259 MB available with about
          # 12 GB of its swap in use while both links ran, so the pair now
          # commits roughly 27 GB, and the link left running alone still held
          # 9.7 GB resident. The macOS arm64 leg of that run and of its retry
          # (38198979588) was still inside both links 75 and 81 minutes after
          # kin-daemon began compiling, and reached this job's 90-minute bound
          # both times; v0.8.1 had already needed 63 and 73 minutes for the same
          # phase. Neither macOS log carried a memory reading, so memory is the
          # cause inferred from that measurement and the runner's size, and the
          # sampler below is what confirms or refutes it.
          #
          # Each binary is its own invocation with the same -p pair, so Cargo
          # resolves features exactly as the combined build does. The combined
          # invocation then runs unchanged, finds both binaries fresh and
          # rebuilds nothing; were it ever to rebuild, the shipped bytes would
          # still be the combined build's. The other legs keep linking both at
          # once, because their runners hold the pair and running the links in
          # series would put the shorter one on the critical path for nothing.
          sampler=""
          if [ "$(uname -s)" = Linux ]; then
            echo "resources before the build"
            nproc || true
            free -m || true
            swapon --show || true
            df -h || true
            # Raise total swap to the target, never taking more than half of
            # what is free, and add to the image's swapfile rather than
            # replacing it so nothing already paging is disturbed.
            want_mb=24576
            free_mb=$(df -m --output=avail / | tail -1 | tr -d ' ')
            room_mb=$(( free_mb / 2 ))
            [ "$want_mb" -le "$room_mb" ] || want_mb=$room_mb
            have_mb=$(awk '/^SwapTotal:/{printf "%d", $2/1024}' /proc/meminfo)
            add_mb=$(( want_mb - have_mb ))
            if [ "$add_mb" -gt 512 ]; then
              swapfile=/kin-release-swapfile
              sudo rm -f "$swapfile"
              if sudo fallocate -l "${add_mb}M" "$swapfile" \
                && sudo chmod 600 "$swapfile" \
                && sudo mkswap "$swapfile" > /dev/null \
                && sudo swapon "$swapfile"
              then
                echo "added ${add_mb}MB of swap for a ${want_mb}MB total"
              else
                # A swapfile the kernel refuses is usually one fallocate left
                # holding unwritten extents, which a written file cannot have.
                sudo swapoff "$swapfile" 2> /dev/null || true
                sudo rm -f "$swapfile"
                sudo dd if=/dev/zero of="$swapfile" bs=1M count="$add_mb" status=none
                sudo chmod 600 "$swapfile"
                sudo mkswap "$swapfile" > /dev/null
                sudo swapon "$swapfile"
                echo "added ${add_mb}MB of swap for a ${want_mb}MB total, written rather than allocated"
              fi
            else
              echo "existing ${have_mb}MB of swap already meets the ${want_mb}MB target"
            fi
            swapon --show || true
            free -m || true
            (
              set +e
              set +o pipefail
              while :; do
                avail=$(awk '/^MemAvailable:/{printf "%d", $2/1024}' /proc/meminfo)
                swap=$(awk '/^SwapFree:/{printf "%d", $2/1024}' /proc/meminfo)
                root=$(df -m / | awk 'NR==2{print $4}')
                top=$(ps -eo rss=,comm= --sort=-rss | head -1 | awk '{printf "%s/%dMB", $2, $1/1024}')
                echo "resource-sample $(date -u +%H:%M:%SZ) mem_avail_mb=$avail swap_free_mb=$swap root_free_mb=$root top_rss=$top"
                sleep 15
              done
            ) &
            sampler=$!
          elif [ "$(uname -s)" = Darwin ]; then
            echo "resources before the build"
            sysctl -n hw.ncpu hw.memsize || true
            sysctl vm.swapusage || true
            df -h / || true
            (
              set +e
              set +o pipefail
              page=$(sysctl -n hw.pagesize)
              while :; do
                vm=$(vm_stat)
                free=$(printf '%s\n' "$vm" | awk -v p="$page" '/^Pages free:/{sub(/\./,"",$3); printf "%d", $3*p/1048576}')
                comp=$(printf '%s\n' "$vm" | awk -v p="$page" '/^Pages occupied by compressor:/{sub(/\./,"",$5); printf "%d", $5*p/1048576}')
                swap=$(sysctl -n vm.swapusage | awk '{for(i=1;i<NF;i++) if($i=="used"){v=$(i+2); sub(/M$/,"",v); printf "%d", v}}')
                pressure=$(sysctl -n kern.memorystatus_vm_pressure_level)
                top=$(ps -axo rss=,ucomm= | sort -rn | head -2 | awk '{printf "%s%s/%dMB", sep, $2, $1/1024; sep=","}')
                echo "resource-sample $(date -u +%H:%M:%SZ) mem_free_mb=$free compressed_mb=$comp swap_used_mb=$swap pressure=$pressure top_rss=$top"
                sleep 15
              done
            ) &
            sampler=$!
          fi
          rc=0
          if [ "$TARGET" = aarch64-apple-darwin ]; then
            for bin in kin kin-daemon; do
              echo "linking $bin on its own"
              cargo build --locked --release --target "$TARGET" -p kin-cli -p kin-daemon --bin "$bin" || { rc=$?; break; }
            done
          fi
          # Default archives include graph/vector and optional HTTP support.
          # Local inference is available in explicitly enabled source builds.
          if [ "$rc" -eq 0 ]; then
            cargo build --locked --release --target "$TARGET" -p kin-cli -p kin-daemon || rc=$?
          fi
          if [ -n "$sampler" ]; then
            kill "$sampler" 2>/dev/null || true
          fi
          if [ "$(uname -s)" = Linux ]; then
            echo "resources after the build"
            free -m || true
            df -h || true
          elif [ "$(uname -s)" = Darwin ]; then
            echo "resources after the build"
            sysctl vm.swapusage || true
            df -h / || true
          fi
          exit "$rc"
        env:
          TARGET: ${{ matrix.target }}

      - name: Build kin-cli + kin-daemon (cross)
        if: ${{ matrix.cross }}
        run: cross build --locked --release --target "$TARGET" -p kin-cli -p kin-daemon
        env:
          TARGET: ${{ matrix.target }}

      # KinNotifier.app carries Kin's notification identity. macOS derives a
      # notification's sender name, icon, and grouping from the posting
      # process's bundle, so without this the CLI's notifications are credited
      # to Script Editor. macOS-only: there is no bundle concept elsewhere.
      - name: Build and assemble KinNotifier.app (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" -p kin-notifier-macos
          crates/kin-notifier-macos/bundle.sh \
            "target/${TARGET}/release/KinNotifier" \
            "target/${TARGET}/release" \
            "$RC_VERSION"
        env:
          TARGET: ${{ matrix.target }}

      # The native provenance check, run on the bytes just linked. release.yml
      # runs the same script on the archive it publishes, on a runner that can
      # execute it, so the producer and the consumer judge by one rule.
      # It writes kin-build-meta.json where the manifest step below reads it.
      - name: Verify native release build provenance
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          suffix=""
          [ "$RUNNER_OS" = "Windows" ] && suffix=".exe"
          node scripts/verify-native-release-provenance.mjs \
            --kin "target/$TARGET/release/kin$suffix" \
            --daemon "target/$TARGET/release/kin-daemon$suffix" \
            --target "$TARGET" \
            --expect-commit "$(git rev-parse HEAD)" \
            --expect-version "$RC_VERSION" \
            --cargo-lock Cargo.lock \
            --out "$RUNNER_TEMP/kin-release-provenance-$TARGET"

      - name: Assert release build did not mutate source
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty" >&2
            echo "::error::release build mutated the source checkout"
            exit 1
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir "$ARTIFACT"
          cp "target/${TARGET}/release/kin" "$ARTIFACT/"
          # kin-daemon is mandatory (no `|| true`): a daemon-less
          # archive lets `kin init` succeed but then `kin status`/`kin search`
          # fail with no daemon on PATH, so a missing daemon must fail the build.
          cp "target/${TARGET}/release/kin-daemon" "$ARTIFACT/"
          # KinNotifier.app is macOS-only and is copied whole: -R preserves the
          # bundle structure and the stapled notarization ticket inside it.
          if [ -d "target/${TARGET}/release/KinNotifier.app" ]; then
            cp -R "target/${TARGET}/release/KinNotifier.app" "$ARTIFACT/"
          fi
          # Words, not just executables. Both arms of the isolated stranger run
          # installed this archive successfully and both scored the packaging
          # below the binaries, because nothing in it says where the two
          # executables go or that the daemon belongs beside the CLI.
          node scripts/write-release-archive-docs.mjs "$ARTIFACT" "$TARGET" "$RC_VERSION"
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"
          # Take the listing once into a file. Piping it into `grep -q` lets grep
          # exit on its first match, and under `pipefail` the SIGPIPE that raises
          # on `tar` fails the pipeline, which reads exactly like the member being
          # absent. Reading a file cannot invert the guard that way.
          ARCHIVE_LISTING="$RUNNER_TEMP/${ARTIFACT}.listing.txt"
          tar tzf "${ARTIFACT}.tar.gz" > "$ARCHIVE_LISTING"
          # All supported Unix surfaces are mandatory release contents.
          for required in kin kin-daemon README.md INSTALL.md checksums-sha256.txt; do
            if ! grep -q "/${required}$" "$ARCHIVE_LISTING"; then
              echo "::error::$required missing from ${ARTIFACT}.tar.gz"
              exit 1
            fi
          done
          # The notifier is mandatory on macOS. Without it the CLI still runs but
          # every notification is credited to Script Editor, which is a silent
          # downgrade rather than a visible failure, so assert it here.
          if [ "$RUNNER_OS" = "macOS" ]; then
            if ! grep -q "KinNotifier.app/Contents/MacOS/KinNotifier$" "$ARCHIVE_LISTING"; then
              echo "::error::KinNotifier.app missing from ${ARTIFACT}.tar.gz"
              exit 1
            fi
          fi
          shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:ARTIFACT
          Copy-Item "target/$env:TARGET/release/kin.exe" "$env:ARTIFACT/"
          # kin-daemon is mandatory: fail hard if it's missing rather
          # than ship a daemon-less archive that can `kin init` but nothing else.
          Copy-Item "target/$env:TARGET/release/kin-daemon.exe" "$env:ARTIFACT/" -ErrorAction Stop
          # See the Unix leg: the archive carries its own README, INSTALL and
          # checksum manifest so a stranger is not guessing at layout.
          node scripts/write-release-archive-docs.mjs "$env:ARTIFACT" "$env:TARGET" $env:RC_VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Error "failed to write the release archive documentation"
            exit 1
          }
          Compress-Archive -Path "$env:ARTIFACT/*" -DestinationPath "$env:ARTIFACT.zip"
          # Assert the produced zip actually contains kin-daemon.exe.
          $entries = [System.IO.Compression.ZipFile]::OpenRead("$PWD/$env:ARTIFACT.zip").Entries.Name
          if ($entries -notcontains "kin-daemon.exe") {
            Write-Error "kin-daemon.exe missing from $env:ARTIFACT.zip, refusing to publish a daemon-less archive"
            exit 1
          }
          foreach ($doc in @("README.md", "INSTALL.md", "checksums-sha256.txt")) {
            if ($entries -notcontains $doc) {
              Write-Error "$doc missing from $env:ARTIFACT.zip"
              exit 1
            }
          }
          # The POSIX installer builds one archive name for every platform it
          # detects, "kin-<os>-<arch>.tar.gz", and it detects windows from the
          # MSYS, MINGW, and CYGWIN uname strings. Piping the documented curl
          # command into a shell on Windows therefore asked for a tarball this
          # leg never produced, and every release to date answered that request
          # with a 404. Publish the same components under that exact name beside
          # the zip. The zip stays the primary archive: the PowerShell
          # installer, the npm launcher, and `kin update` all resolve Windows by
          # that name, and anything already depending on it keeps working.
          tar -czf "$env:ARTIFACT.tar.gz" "$env:ARTIFACT"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "tar failed to package $env:ARTIFACT.tar.gz"
            exit 1
          }
          $members = @(tar -tzf "$env:ARTIFACT.tar.gz")
          if ($LASTEXITCODE -ne 0) {
            Write-Error "tar failed to list $env:ARTIFACT.tar.gz"
            exit 1
          }
          $members = @($members | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" })
          # The Unix legs wrap their contents in a single "<artifact>/" root and
          # the release shape rules refuse a member carrying a backslash, so
          # assert both here rather than discovering a Windows path separator in
          # the publish job after the archive is already built.
          $prefix = "$env:ARTIFACT/"
          foreach ($member in $members) {
            if ($member.Contains("\")) {
              Write-Error "$env:ARTIFACT.tar.gz member '$member' uses a Windows path separator"
              exit 1
            }
            if (-not $member.StartsWith($prefix)) {
              Write-Error "$env:ARTIFACT.tar.gz member '$member' is not under $prefix"
              exit 1
            }
          }
          $TarNames = @(
            $members |
              Where-Object { -not $_.EndsWith("/") } |
              ForEach-Object { $_.Substring($prefix.Length) } |
              Sort-Object
          )
          $ZipNames = @($entries | Sort-Object)
          if (Compare-Object -ReferenceObject $ZipNames -DifferenceObject $TarNames) {
            Write-Error "$env:ARTIFACT.tar.gz and $env:ARTIFACT.zip do not carry the same components"
            exit 1
          }
          if ($TarNames -notcontains "kin-daemon.exe") {
            Write-Error "kin-daemon.exe missing from $env:ARTIFACT.tar.gz"
            exit 1
          }
          # A sidecar is the one LF-terminated line sha256sum writes. Set-Content
          # ends a line with this platform's CRLF, and sha256sum -c on Linux or
          # macOS then reads a file name ending in CR and finds no such archive,
          # so write the LF explicitly and read the bytes back.
          foreach ($ArchivePath in @("$env:ARTIFACT.zip", "$env:ARTIFACT.tar.gz")) {
            $Hash = (Get-FileHash -Algorithm SHA256 $ArchivePath).Hash.ToLowerInvariant()
            $Sidecar = "$Hash  $ArchivePath`n"
            Set-Content -NoNewline -Encoding ascii -Path "$ArchivePath.sha256" -Value $Sidecar
            if ((Get-Content -Raw -Encoding ascii "$ArchivePath.sha256") -cne $Sidecar) {
              Write-Error "$ArchivePath.sha256 is not the single LF-terminated line sha256sum -c reads"
              exit 1
            }
          }
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}

      - name: Generate artifact provenance manifest
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const childProcess = require("child_process");
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");

          const artifact = process.env.ARTIFACT;
          const { readUpdateBuildIdentity } = require("./scripts/read-update-build-identity.cjs");
          const { classifyReleaseArchiveRoot } = require("./scripts/release-archive-shape.cjs");
          const target = process.env.TARGET;
          const root = process.cwd();
          const authorityNames = new Set(
            target.includes("-windows-")
              ? ["kin.exe", "kin-daemon.exe"]
              : ["kin", "kin-daemon"]
          );
          const sha256 = (file) =>
            crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const git = (cwd, ...args) =>
            childProcess.execFileSync("git", args, { cwd, encoding: "utf8" }).trim();

          const kinCommit = git(root, "rev-parse", "HEAD");
          const kinLockSha = sha256(path.join(root, "Cargo.lock"));
          const buildMetaPath = path.join(
            process.env.RUNNER_TEMP,
            `kin-release-provenance-${target}`,
            "kin-build-meta.json"
          );
          const buildMeta = JSON.parse(fs.readFileSync(buildMetaPath, "utf8"));
          if (buildMeta.kin_commit !== kinCommit || buildMeta.dependency_provenance !== kinLockSha) {
            throw new Error("embedded build provenance does not match the tagged Kin source and Cargo.lock");
          }

          // Windows publishes two containers of the same components: the zip
          // every Windows resolver already asks for, and the tarball the POSIX
          // installer builds its name from. The zip stays the manifest's
          // primary archive because `kin update` and the public install proof
          // both find the platform record by that exact name; the tarball is
          // inventoried beside it so its bytes are covered by the same
          // provenance rather than published unaccounted for.
          const windowsTarget = target.includes("-windows-");
          const primaryArchive = windowsTarget ? `${artifact}.zip` : `${artifact}.tar.gz`;
          const additionalArchiveNames = windowsTarget ? [`${artifact}.tar.gz`] : [];
          const expectedArchives = [primaryArchive, ...additionalArchiveNames].sort();
          const archives = [`${artifact}.tar.gz`, `${artifact}.zip`]
            .filter((file) => fs.existsSync(file))
            .sort();
          if (JSON.stringify(archives) !== JSON.stringify(expectedArchives)) {
            throw new Error(`expected final archives ${expectedArchives.join(", ")} for ${artifact}, found ${archives.join(", ") || "none"}`);
          }
          const archive = primaryArchive;
          const archiveRecord = (name) => ({
            name,
            sha256: sha256(name),
            size_bytes: fs.statSync(name).size,
          });
          // The content inventory covers the archive's component files and nothing
          // else. An installed updater refuses any inventory name outside its
          // managed component list, so the macOS notification bundle, a sealed
          // directory rather than a component, and the three documentation
          // members are classified and shape-checked here but stay out of the
          // manifest. v0.6.2 refused the v0.6.3 manifest on `checksums-sha256.txt`,
          // the first documentation record in it, and no managed install could
          // update across any release from v0.5.45 on. Their bytes are covered by
          // the archive digest; the bundle's also by its code signature and
          // stapled notarization, the docs' also by the in-archive checksum file.
          const contents = classifyReleaseArchiveRoot(artifact, { target })
            .files
            .map((name) => {
              const file = path.join(artifact, name);
              const record = {
                name,
                sha256: sha256(file),
                size_bytes: fs.statSync(file).size,
              };
              if (authorityNames.has(name)) {
                record.build_identity = readUpdateBuildIdentity(file);
              }
              return record;
            })
            .sort((left, right) => left.name.localeCompare(right.name));
          if (contents.length < 2) {
            throw new Error(`${artifact} does not contain the mandatory kin and kin-daemon binaries`);
          }
          // A candidate has no tag, so the version both static
          // build identities must agree on is the workspace package version the
          // job resolved. The cross-check between kin and kin-daemon is intact;
          // what a candidate cannot assert is agreement with a tag name.
          const expectedVersion = process.env.RC_VERSION;
          const authorityRecords = contents.filter((record) => authorityNames.has(record.name));
          if (authorityRecords.length !== authorityNames.size) {
            throw new Error(`${artifact} does not contain both static build-identity authorities`);
          }
          const graphVersions = new Set();
          for (const record of authorityRecords) {
            const identity = record.build_identity;
            if (
              identity.version !== expectedVersion ||
              identity.commit !== kinCommit ||
              identity.clean !== true ||
              identity.source_known !== true ||
              identity.dependency_provenance !== kinLockSha
            ) {
              throw new Error(`${record.name} static build identity does not match the tagged release source`);
            }
            graphVersions.add(identity.graph_snapshot_version);
          }
          if (graphVersions.size !== 1) {
            throw new Error(`${artifact} CLI and daemon graph snapshot identities disagree`);
          }

          const manifest = {
            schema_version: 2,
            // A candidate manifest names the ref and sha it was
            // built from. It carries no release_tag, so it can never be mistaken
            // for a published release's provenance.
            release_candidate: {
              ref: process.env.RC_REF,
              version: process.env.RC_VERSION,
            },
            artifact,
            target,
            kin: {
              commit: kinCommit,
              cargo_lock_sha256: kinLockSha,
              embedded_dependency_provenance: buildMeta.dependency_provenance,
            },
            archive: archiveRecord(archive),
            ...(additionalArchiveNames.length
              ? { additional_archives: additionalArchiveNames.map(archiveRecord) }
              : {}),
            archive_contents: contents,
            workflow: {
              repository: process.env.GITHUB_REPOSITORY,
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            },
          };
          fs.writeFileSync(`${artifact}.provenance.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          # These are the bytes a release publishes, so the retention is how long
          # after this run a tag can still publish or recover them. The
          # selector and release.yml both refuse a run whose artifacts expired
          # rather than rebuilding, because a rebuild is not the bytes the
          # preflight judged. An empty upload fails here rather than surfacing
          # as a missing archive in whatever consumes the run.
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
            ${{ matrix.artifact }}.provenance.json

      # The run's own answer to "which bytes did this produce". A
      # consumer downloads by run id, so the run has to name the sha it built
      # and the digest of every archive it uploaded.
      - name: Summarize the candidate archives
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          {
            printf '### %s\n\n' "$ARTIFACT"
            printf '| field | value |\n| --- | --- |\n'
            printf '| built sha | %s |\n' "$RC_REF"
            printf '| version | %s |\n' "$RC_VERSION"
            printf '| produced by | %s on %s |\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
          found=0
          for archive in "${ARTIFACT}.tar.gz" "${ARTIFACT}.zip"; do
            [ -f "$archive" ] || continue
            found=1
            printf '| %s sha256 | %s |\n' \
              "$archive" "$(shasum -a 256 "$archive" | cut -d' ' -f1)" \
              >> "$GITHUB_STEP_SUMMARY"
          done
          # The upload step already refuses an empty artifact; this refuses the
          # narrower case where the summary would report a build that produced
          # no archive at all, which would otherwise read as a clean run.
          if [ "$found" = 0 ]; then
            echo "::error::no archive was produced for $ARTIFACT"
            exit 1
          fi
          printf '\nDownload these archives with: gh run download %s --repo %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

  # The daemon image a release pushes to GHCR, built once and smoke-tested here
  # before any tag exists. release.yml used to build it at the tag, which put a
  # 19 to 25 minute compile inside a frozen workflow; it now verifies this
  # archive and pushes it with its digests preserved.
  #
  # The image is exported as an OCI image layout archive rather than loaded
  # into a registry or the local store, because that keeps every compressed
  # layer, the config and the manifest as exact blobs: the manifest digest
  # recorded here is the digest GHCR serves after release.yml's push. The
  # smokes run on the same archive loaded into Docker, and
  # scripts/rc-daemon-image.mjs proves the loaded image carries the archive's
  # layers and runtime config before any smoke counts.
  #
  # It needs nothing from the build matrix and runs beside it, so a build leg
  # that times out leaves it to finish on its own; the jobs that do need the
  # matrix (capability and attest) end skipped in that case, never cancelled.
  # Its name is deliberately not "RC Build (...)", which names a build leg.
  image:
    name: RC Daemon Image
    if: ${{ github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main' }}
    # The same cold, fat-LTO image took 29.4 minutes on the standard pool and
    # 14.9 on this native 16-core runner, measured once per size on the same
    # source. 32 cores took 13.4, below the other build legs either way, so
    # 16 removes the image from the critical path. This pretag producer can
    # wait for its pool without stranding a release tag; release.yml only
    # verifies and publishes the archive it uploads.
    runs-on: ${{ vars.KIN_RC_USE_GITHUB_RUNNERS == 'true' && 'ubuntu-latest' || 'depot-ubuntu-24.04-16' }}
    # A ceiling for a stalled build, with the smokes still inside the merge
    # queue's 90-minute window.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve the image source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=all)"
          # A merge group builds the commit that lands on main, and the image
          # names the branch it ships from; any other run names its own ref.
          branch="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            branch=main
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Base images resolve through a mirror first, as every Dockerfile build
      # here does; the Dockerfile pins both bases by digest, so the mirror and
      # the canonical registry cannot serve different bytes.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # No --cache-from: see the note at the top of this file. --provenance=false
      # keeps the layout to one image manifest; this run's attest job signs the
      # provenance instead, and release.yml attests the pushed digest again.
      - name: Build the daemon image as an OCI archive
        shell: bash
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kin-daemon-image"
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --provenance=false \
            --build-arg "KIN_BUILD_GIT_SHA=${COMMIT}" \
            --build-arg KIN_BUILD_DIRTY=false \
            --build-arg "KIN_BUILD_BRANCH=${BRANCH}" \
            --output "type=oci,dest=${RUNNER_TEMP}/kin-daemon-image/kin-daemon-image.oci.tar" \
            .

      - name: Record the image's digests
        shell: bash
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/kin-daemon-image"
          node scripts/rc-daemon-image.mjs record \
            --archive "$dir/kin-daemon-image.oci.tar" \
            --commit "$COMMIT" \
            --out "$dir/kin-daemon-image.json"
          ( cd "$dir" && sha256sum kin-daemon-image.oci.tar > kin-daemon-image.oci.tar.sha256 )

      - name: Load the archive for the smoke tests
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kin-daemon-image/kin-daemon-image.oci.tar"
          skopeo copy "oci-archive:${archive}" docker-daemon:kin:ci
          node scripts/rc-daemon-image.mjs check-loaded --archive "$archive" --image kin:ci

      - name: Verify container build provenance
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.commit }}
        run: bash scripts/verify-container-build-info.sh kin:ci "$EXPECTED_SHA"

      # The same smokes docker.yml runs on the development image every main
      # commit builds, here on the image a release ships.
      - name: Entrypoint smoke (local boot + SIGTERM, gcs prep, unwritable fail)
        run: bash scripts/test-entrypoint-smoke.sh kin:ci

      - name: Entrypoint contract with a volume mounted inside .kin
        run: bash scripts/test-entrypoint-workspace-mount.sh kin:ci

      - name: Published port reachable from outside the container namespace
        run: bash scripts/test-compose-published-port.sh kin:ci

      - name: GCS emulator endpoint acceptance
        run: bash scripts/test-gcs-emulator-endpoint.sh kin:ci

      - name: Upload the image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: kin-daemon-image
          # As long as the archives: these are the bytes a release pushes.
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/kin-daemon-image/kin-daemon-image.oci.tar
            ${{ runner.temp }}/kin-daemon-image/kin-daemon-image.oci.tar.sha256
            ${{ runner.temp }}/kin-daemon-image/kin-daemon-image.json

      - name: Summarize the image
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/kin-daemon-image"
          {
            printf '### kin-daemon-image\n\n'
            printf '| field | value |\n| --- | --- |\n'
            printf '| manifest digest | %s |\n' "$(jq -r .manifest_digest "$dir/kin-daemon-image.json")"
            printf '| archive sha256 | %s |\n' "$(cut -d' ' -f1 "$dir/kin-daemon-image.oci.tar.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"

  # What a candidate build could not say before this job existed: whether the
  # bytes it produced survive a first install. v0.5.41 built cleanly on all five
  # platforms and then died at the tag's own doctor health gate, because setup
  # recorded a mount projection it never engaged and `kin doctor` read the
  # recorded mode against the running state. That defect is visible the moment
  # anything installs the archive and asks, and nothing pre-tag ever asked on a
  # non-Linux platform.
  #
  # This job asks, on the archives this run actually built, and it stays inside
  # the properties that make rc-build.yml safe to dispatch on any ref: it reads
  # no secret, declares no environment, takes no permission beyond the
  # workflow's `contents: read`, writes to no cache, and touches no release
  # asset. It installs through the same scripts/install.sh a stranger runs, over
  # a file:// base URL, which is that installer's own documented offline path.
  #
  # It is deliberately NOT a fourth copy of the capability contract.
  # install-proof.yml holds that contract and remains the authority; the three
  # copies that already exist are a known maintenance hazard and this does not
  # add another. What is asserted here is a named subset that a candidate
  # install with no agent clients present can legitimately satisfy, plus the
  # rollup-consistency invariant over the whole report. Every other check is
  # printed to the job summary and explicitly not asserted, so the summary can
  # never be read as coverage this job did not provide.
  capability:
    name: RC Capability (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    # Measured at 0.2 to 1.4 minutes per leg. Bounded at 15 in a merge group so
    # a build leg at its 60-minute bound plus this still fits the queue window.
    timeout-minutes: ${{ github.event_name == 'merge_group' && 15 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `covered` is this row's claim about whether the build matrix above
          # produces an archive it can install. The first step reads that matrix
          # and refuses a row whose claim is wrong in either direction, so
          # adding a build row without enabling its probe fails here rather than
          # leaving the platform silently unproven, and a probe claiming an
          # archive that is not built fails instead of reporting a vacuous pass.
          - os: ubuntu-latest
            artifact: kin-linux-x86_64
            covered: true
            setup-shell: bash
          - os: ubuntu-24.04-arm
            artifact: kin-linux-aarch64
            covered: true
            setup-shell: bash
          - os: macos-15-intel
            artifact: kin-macos-x86_64
            covered: true
            setup-shell: zsh
          - os: macos-latest
            artifact: kin-macos-aarch64
            covered: true
            setup-shell: zsh
          - os: windows-latest
            artifact: kin-windows-x86_64
            covered: true
            setup-shell: powershell

    steps:
      # Before the checkout, or it has nothing to act on. Windows otherwise
      # checks out CRLF, and rc-build run 32275955235 is what that costs: every
      # line of the workflow carried a trailing \r, the reconciler's exact match
      # on "  build:" found nothing, and it reported "rc-build.yml has no build
      # job to read a matrix from". That reads as a verdict about the workflow
      # and was a fact about the probe. The parser below strips \r as well, so
      # neither half of the fix depends on the other.
      - name: Preserve tracked bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Reconcile this row's coverage claim against the build matrix
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          COVERED: ${{ matrix.covered }}
        run: |
          set -uo pipefail
          # `-e` is on by default in this shell and must be off across the
          # reconciler, because a nonzero exit is one of its answers rather than
          # an accident. Every path below exits explicitly.
          set +e
          verdict=kin-coverage-verdict.txt
          rm -f "$verdict"
          # Three outcomes that must never be confusable. RECONCILED and
          # MISMATCH are verdicts about the build matrix. Anything else is
          # UNREADABLE, which is a fact about this probe and says nothing about
          # coverage. The verdict is a FILE rather than an exit code alone, so a
          # reconciler that died before answering cannot be read as one that
          # answered: run 32275955235 threw exit 1 for a CRLF parse failure,
          # which is the same exit a real mismatch would have used.
          VERDICT_FILE="$verdict" node <<'NODE'
          const fs = require("fs");
          const write = (line) => fs.writeFileSync(process.env.VERDICT_FILE, `${line}\n`);
          const unreadable = (why) => { write(`UNREADABLE ${why}`); process.exit(30); };
          const mismatch = (why) => { write(`MISMATCH ${why}`); process.exit(20); };
          let lines;
          try {
            // Split on either line ending. A CRLF checkout otherwise leaves a
            // trailing \r on every line and no exact match can land.
            lines = fs.readFileSync(".github/workflows/rc-build.yml", "utf8").split(/\r?\n/);
          } catch (error) {
            unreadable(`this probe could not read .github/workflows/rc-build.yml: ${error.message}`);
          }
          const start = lines.indexOf("  build:");
          if (start === -1) {
            unreadable("this probe found no '  build:' line in rc-build.yml, so it read no matrix at all");
          }
          let end = lines.length;
          for (let i = start + 1; i < lines.length; i += 1) {
            if (/^  [A-Za-z_][A-Za-z0-9_-]*:\s*$/.test(lines[i])) { end = i; break; }
          }
          const built = lines
            .slice(start, end)
            .filter((line) => /^\s+artifact:\s/.test(line))
            .map((line) => line.trim().slice("artifact:".length).trim());
          // A parse that silently returned nothing would make every claim below
          // read as "not built", which is the answer this job exists to stop
          // anyone from faking. That is a broken probe, not an uncovered
          // platform, so it reports UNREADABLE rather than a verdict.
          if (built.length < 2 || !built.includes("kin-linux-x86_64")) {
            unreadable(`this probe read ${built.length} artifact rows out of the build matrix (${built.join(", ") || "none"})`);
          }
          const artifact = process.env.ARTIFACT;
          const covered = process.env.COVERED === "true";
          const isBuilt = built.includes(artifact);
          if (covered && !isBuilt) {
            mismatch(`this row claims to probe ${artifact}, but the build matrix builds ${built.join(", ")}`);
          }
          if (!covered && isBuilt) {
            mismatch(`the build matrix now builds ${artifact}, so this row must set covered: true and probe it rather than reporting the platform unproven`);
          }
          write(`RECONCILED ${artifact} covered=${covered} built=${isBuilt}; the build matrix produces ${built.join(", ")}`);
          NODE
          rc=$?
          if [ ! -f "$verdict" ]; then
            echo "::error::UNREADABLE: the coverage reconciler exited $rc without writing a verdict. That is a fact about this probe, not a coverage verdict: nothing here says whether $ARTIFACT is built or not."
            exit 1
          fi
          line="$(cat "$verdict")"
          rm -f "$verdict"
          case "$line" in
            RECONCILED*)
              printf '%s\n' "$line"
              exit 0
              ;;
            MISMATCH*)
              echo "::error::COVERAGE MISMATCH: ${line#MISMATCH }"
              exit 1
              ;;
            UNREADABLE*)
              echo "::error::UNREADABLE: ${line#UNREADABLE } (reconciler exit $rc). That is a fact about this probe, not a coverage verdict: nothing here says whether $ARTIFACT is built or not."
              exit 1
              ;;
            *)
              echo "::error::UNREADABLE: the coverage reconciler wrote a verdict this step does not recognize: $line"
              exit 1
              ;;
          esac

      - name: Record a platform this run builds no archive for
        if: ${{ !matrix.covered }}
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          PROBE_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          {
            printf '### %s: NOT COVERED\n\n' "$PROBE_OS"
            printf 'This run built no %s archive, so nothing here installed or probed a\n' "$ARTIFACT"
            printf 'candidate on %s. The row is present so the absence is stated rather than\n' "$PROBE_OS"
            printf 'inferred from a job list.\n\n'
            printf 'What stays unproven until the tag: whether a first install on %s reaches\n' "$PROBE_OS"
            printf 'a healthy doctor report. That is proved only by release.yml, whose install\n'
            printf 'proof runs after the archives are published, which is the last gate before\n'
            printf 'promotion and the one v0.5.41 died on.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::$PROBE_OS candidate capability is not covered pre-tag: this workflow builds no $ARTIFACT archive"

      - name: Download the candidate archive
        if: ${{ matrix.covered }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/kin-candidate

      - name: Install the candidate through the public installer
        if: ${{ matrix.covered }}
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          node --test scripts/prove-candidate-install.test.mjs
          node scripts/prove-candidate-install.mjs

      - name: Preserve exact candidate install evidence
        if: ${{ always() && matrix.covered }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: candidate-install-${{ matrix.artifact }}
          path: ${{ runner.temp }}/kin-candidate-install
          if-no-files-found: error
          retention-days: 7

      # The existing health subset is macOS-specific. Every platform above
      # proves native packaging/install/provenance; this is additional evidence,
      # not a claim that Windows or Linux received the full install-proof suite.
      - name: Capture the first-install doctor and setup health surface
        if: ${{ matrix.covered && runner.os == 'macOS' }}
        shell: bash
        env:
          PROBE_SHELL: ${{ matrix.setup-shell }}
        run: |
          set -euo pipefail
          export SHELL="/bin/$PROBE_SHELL"
          # A fresh repository so the daemon has something to initialize
          # against, outside the workspace so the checkout this job made for the
          # installer never becomes corpus, and captures written outside the
          # probe repo too: the daemon admits observed new files as they are
          # written, so a report written into the admitted tree becomes corpus
          # and the store grows while it is measured.
          captures="$RUNNER_TEMP/kin-candidate-captures"
          probe="$RUNNER_TEMP/kin-candidate-probe"
          mkdir -p "$captures" "$probe"
          cd "$probe"
          git init -q && git config user.email ci@firelock.ai && git config user.name ci
          printf 'def hello():\n    return 42\n' > probe.py
          git add -A && git commit -qm "probe"
          kin init > "$captures/kin-init.txt" 2>&1
          cat "$captures/kin-init.txt"
          # setup is what records the projection mode, so the doctor reports
          # below are only meaningful after it has run.
          kin setup --no-interactive --intent agent --shell "$PROBE_SHELL" \
            2>&1 | tee "$captures/kin-setup.txt"
          # An unhealthy report is the finding, not a reason to stop before
          # anything can read it. Capture the exit status and let the next step
          # name the failing checks; a doctor that writes no JSON at all still
          # fails there, and says so.
          health_status=0
          kin setup status --json > "$captures/kin-health.json" || health_status=$?
          doctor_status=0
          kin doctor --json > "$captures/kin-doctor.json" || doctor_status=$?
          printf 'kin setup status exit %s, kin doctor exit %s\n' "$health_status" "$doctor_status"

      - name: Judge the candidate health surface
        if: ${{ matrix.covered && runner.os == 'macOS' }}
        shell: bash
        env:
          PROBE_OS: ${{ matrix.os }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const captures = `${process.env.RUNNER_TEMP}/kin-candidate-captures`;
          // The named subset a candidate install with no agent clients present
          // can legitimately satisfy. projection_mode is the check v0.5.41's
          // tag reported misconfigured on every fresh macOS and Windows
          // install; it is in this list for that reason and not by accident.
          const asserted = [
            "kin_binary",
            "kin_daemon_binary",
            "daemon_running",
            "repo_init",
            "shell_path",
            "setup_ledger",
            "vfs_projection",
            "projection_mode",
          ];
          // --- BEGIN HEALTH JOIN ---
          // A check is out of scope only when the platform or the context puts it out of
          // scope, which is exactly `unsupported`. Every other status is a component that
          // is not answering at full strength, so a report claiming readiness over one
          // claims more than its components support (FIR-2919).
          const healthNeedsAttention = (check) =>
            check.status !== "healthy" && check.status !== "unsupported";
          // Something wrong with the INSTALL, as against work in flight or ground the
          // host never had. A different question from the one above, and conflating the
          // two is what fenced v0.6.1.
          const healthBlocksReadiness = (check) =>
            check.status === "missing" ||
            check.status === "misconfigured" ||
            (check.id === "semantic_query_readiness" && check.status === "stale");
          const healthJoin = (checks) => {
            if (checks.some(healthBlocksReadiness)) return "failing";
            return checks.some(healthNeedsAttention) ? "needs_attention" : "ready";
          };
          // --- END HEALTH JOIN ---

          const summary = [];
          const problems = [];
          for (const name of ["kin-health.json", "kin-doctor.json"]) {
            const report = JSON.parse(fs.readFileSync(`${captures}/${name}`, "utf8"));
            if (!Array.isArray(report.checks)) {
              problems.push(`${name}: checks is missing or malformed`);
              continue;
            }
            const byId = new Map(report.checks.map((check) => [check.id, check]));
            if (byId.size !== report.checks.length) {
              problems.push(`${name}: duplicate health-check ids are not authoritative`);
            }
            // The rollup has to agree with the checks it summarizes. A release
            // has already been abandoned over an aggregate that disagreed with
            // its own list, and that defect is invisible to any check that only
            // reads `healthy`. The rule is pasted above rather than restated
            // here: this copy and the two in install-proof.yml said one thing
            // while the product said another, which is how v0.6.1 was fenced
            // (FIR-2919).
            if (report.verdict === undefined) {
              problems.push(
                `${name}: the report carries no verdict field, so these bytes predate FIR-2919 and their aggregate cannot be graded against the health join`
              );
            } else {
              const verdict = healthJoin(report.checks);
              if (report.verdict !== verdict) {
                problems.push(
                  `${name}: verdict=${report.verdict} disagrees with its checks; expected ${verdict}`
                );
              }
              if (report.healthy !== (verdict === "ready")) {
                problems.push(
                  `${name}: aggregate healthy=${report.healthy} disagrees with its checks; expected ${verdict === "ready"}`
                );
              }
            }
            for (const id of asserted) {
              const status = byId.get(id)?.status;
              if (status === undefined) {
                problems.push(`${name}: ${id} is missing from the report entirely`);
              } else if (status === "missing" || status === "misconfigured") {
                problems.push(`${name}: ${id}=${status}`);
              }
            }
            const rows = report.checks
              .map((check) => {
                const judged = asserted.includes(check.id) ? "asserted" : "reported only";
                return `| ${check.id} | ${check.status} | ${judged} |`;
              })
              .join("\n");
            summary.push(
              `### ${process.env.PROBE_OS}: ${name}\n\n` +
                `Candidate archive \`${process.env.ARTIFACT}\`, aggregate healthy=${report.healthy}, ` +
                `verdict=${report.verdict ?? "absent"}.\n\n` +
                `| check | status | this job |\n| --- | --- | --- |\n${rows}\n`
            );
          }
          summary.push(
            "Checks marked `reported only` are printed rather than judged. " +
              "install-proof.yml holds the full capability contract and remains the authority; " +
              "this probe asserts a named subset plus the rollup-consistency invariant, so nothing " +
              "above should be read as coverage of the whole contract.\n"
          );
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join("\n")}\n`);
          if (problems.length > 0) {
            for (const problem of problems) console.error(`::error::${problem}`);
            throw new Error(
              `the candidate's first-install health surface failed ${problems.length} assertion(s) on ${process.env.PROBE_OS}`
            );
          }
          console.log(`candidate health surface holds on ${process.env.PROBE_OS}`);
          NODE

  # Build provenance for every byte a release takes from this run. release.yml
  # refuses an archive or image whose attestation does not verify against this
  # workflow, at the commit it builds, on the ref the run built, signed by the
  # very run it located (scripts/locate-rc-build.mjs verify-attestation).
  #
  # The OIDC token lives in this job alone. It checks out nothing and runs no
  # repository code: it downloads what the build and image jobs uploaded, checks
  # each file against its sidecar, and signs. It runs on a GitHub-hosted runner,
  # which `--deny-self-hosted-runners` in release.yml requires of the signer;
  # the macOS and Windows bytes it signs were built on the Depot pools above,
  # which is what the run's own job list records.
  attest:
    name: RC Attest
    needs: [build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the archives and the image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: kin-*
          path: ${{ runner.temp }}/rc

      - name: Check every file against its sidecar
        shell: bash
        working-directory: ${{ runner.temp }}/rc
        run: |
          set -euo pipefail
          for file in \
            kin-linux-x86_64/kin-linux-x86_64.tar.gz \
            kin-linux-aarch64/kin-linux-aarch64.tar.gz \
            kin-macos-x86_64/kin-macos-x86_64.tar.gz \
            kin-macos-aarch64/kin-macos-aarch64.tar.gz \
            kin-windows-x86_64/kin-windows-x86_64.zip \
            kin-windows-x86_64/kin-windows-x86_64.tar.gz \
            kin-daemon-image/kin-daemon-image.oci.tar; do
            ( cd "$(dirname "$file")" && sha256sum -c "$(basename "$file").sha256" )
          done

      # With no predicate inputs actions/attest emits SLSA build provenance
      # naming this workflow, this commit, this ref and this run.
      - name: Attest the archives and the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/rc/kin-linux-x86_64/kin-linux-x86_64.tar.gz
            ${{ runner.temp }}/rc/kin-linux-aarch64/kin-linux-aarch64.tar.gz
            ${{ runner.temp }}/rc/kin-macos-x86_64/kin-macos-x86_64.tar.gz
            ${{ runner.temp }}/rc/kin-macos-aarch64/kin-macos-aarch64.tar.gz
            ${{ runner.temp }}/rc/kin-windows-x86_64/kin-windows-x86_64.zip
            ${{ runner.temp }}/rc/kin-windows-x86_64/kin-windows-x86_64.tar.gz
            ${{ runner.temp }}/rc/kin-daemon-image/kin-daemon-image.oci.tar

  # Execute the full Windows install proof on this run's actual candidate zip
  # before any tag exists, reusing the build output and its source provenance.
  rehearsal:
    name: RC rehearsal
    needs: build
    uses: ./.github/workflows/release-rehearsal.yml
    permissions:
      contents: read
      attestations: read
    with:
      candidate_sha: ${{ github.sha }}
      proof_mode: candidate-full
      local_artifact: kin-windows-x86_64
