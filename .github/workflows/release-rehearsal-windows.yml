# Generated by scripts/generate-release-rehearsal.py. Do not edit by hand.
name: Rehearse Windows release proof
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      source_path:
        required: false
        type: string
        default: '.'
      release_tag:
        required: false
        type: string
        default: v0.8.6
      proof_mode:
        required: true
        type: string
      local_artifact:
        required: false
        type: string
        default: ''
permissions:
  contents: read
  attestations: read

jobs:
  install-proof:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: [{"os":"windows-latest","setup-shell":"powershell"}]
    steps:
      - name: Require the workflow context candidate before checkout
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          CONTEXT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTEXT_SHA" =~ ^[0-9a-f]{40}$ || "$CANDIDATE" != "$CONTEXT_SHA" ]]; then
            echo "::error::Rehearsal candidate must equal the actual workflow context SHA"
            exit 1
          fi
      - name: Preserve canonical candidate source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout the exact rehearsal source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: rehearsal-source
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the rehearsal source and stable baseline
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          SOURCE_PATH: ${{ inputs.source_path }}
          BASELINE_TAG: ${{ inputs.release_tag }}
          PROOF_MODE: ${{ inputs.proof_mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "rehearsal-source/$SOURCE_PATH/scripts/release-rehearsal.py" bind \
            --source "rehearsal-source/$SOURCE_PATH" --candidate "$CANDIDATE" \
            --release-tag "$BASELINE_TAG" --mode "$PROOF_MODE"
      - name: Prove the Windows file mirror checksum boundary
        if: inputs.proof_mode == 'compatibility-baseline'
        shell: pwsh
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          $ErrorActionPreference = "Stop"
          & "rehearsal-source/$env:SOURCE_PATH/scripts/test-windows-install-mirror.ps1" -InstallerPath "rehearsal-source/$env:SOURCE_PATH/scripts/install.ps1" -OutputRoot "$env:RUNNER_TEMP/rehearsal/mirror-boundary"
      - name: Install the baseline with the candidate Windows installer
        if: inputs.proof_mode == 'compatibility-baseline'
        shell: pwsh
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          KIN_VERSION: ${{ inputs.release_tag }}
          KIN_NO_SETUP: '1'
        run: |
          $ErrorActionPreference = "Stop"
          $env:KIN_VERSION = $env:KIN_VERSION.TrimStart('v')
          & "rehearsal-source/$env:SOURCE_PATH/scripts/install.ps1"
          "$HOME\.kin\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Rehearse stable baseline setup and Git author identity
        if: inputs.proof_mode == 'compatibility-baseline'
        shell: bash
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          python "rehearsal-source/$SOURCE_PATH/scripts/release-rehearsal-compat.py" \
            --output "$RUNNER_TEMP/rehearsal/compatibility"
      - name: Public install (Unix)
        if: inputs.proof_mode == 'candidate-full' && (runner.os != 'Windows' && !inputs.local_artifact)
        env:
          RELEASE_EVENT_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
        run: |
          set -eu
          if [ -n "$RELEASE_EVENT_TAG" ]; then
            export KIN_VERSION="${RELEASE_EVENT_TAG#v}"
          fi
          curl -fsSL https://get.kinlab.dev/install | KIN_NO_SETUP=1 sh
          echo "$HOME/.kin/bin" >> "$GITHUB_PATH"

      - name: Public install (Windows)
        if: inputs.proof_mode == 'candidate-full' && (runner.os == 'Windows' && !inputs.local_artifact)
        shell: pwsh
        env:
          RELEASE_EVENT_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_EVENT_TAG) {
            $env:KIN_VERSION = $env:RELEASE_EVENT_TAG.TrimStart("v")
          }
          $env:KIN_NO_SETUP = "1"
          irm https://get.kinlab.dev/install.ps1 | iex
          "$HOME\.kin\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download the pull request release archive
        if: inputs.proof_mode == 'candidate-full' && (inputs.local_artifact)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ inputs.local_artifact }}
          path: ${{ runner.temp }}/kin-pull-request-release

      - name: Pull request install (Unix)
        if: inputs.proof_mode == 'candidate-full' && (runner.os != 'Windows' && inputs.local_artifact)
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) ;;
            *) echo "pull-request install proof is built for Linux/X64 only, not $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          staged="$RUNNER_TEMP/kin-pull-request-release"
          version="$(cat "$staged/expected-version.txt")"
          served="$RUNNER_TEMP/kin-pull-request-served"
          mkdir -p "$served/download/v$version"
          cp "$staged/kin-linux-x86_64.tar.gz" \
            "$staged/kin-linux-x86_64.tar.gz.sha256" \
            "$served/download/v$version/"
          KIN_NO_SETUP=1 KIN_VERSION="$version" KIN_BASE_URL="file://$served" \
            sh "$staged/install.sh"
          echo "$HOME/.kin/bin" >> "$GITHUB_PATH"

      - name: Prepare candidate Windows installer and exact metadata
        if: inputs.proof_mode == 'candidate-full'
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          python "rehearsal-source/$SOURCE_PATH/scripts/release-rehearsal.py" stage-candidate \
            --source "rehearsal-source/$SOURCE_PATH" --candidate "$CANDIDATE" \
            --directory "$RUNNER_TEMP/kin-pull-request-release"
      - name: Pull request install (Windows)
        if: inputs.proof_mode == 'candidate-full' && (runner.os == 'Windows' && inputs.local_artifact)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staged = Join-Path $env:RUNNER_TEMP "kin-pull-request-release"
          $version = (Get-Content (Join-Path $staged "expected-version.txt") -Raw).Trim()
          $served = Join-Path $env:RUNNER_TEMP "kin-pull-request-served"
          $download = Join-Path $served "download/v$version"
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          Copy-Item (Join-Path $staged "kin-windows-x86_64.zip") $download
          Copy-Item (Join-Path $staged "kin-windows-x86_64.zip.sha256") $download
          $env:KIN_NO_SETUP = "1"
          $env:KIN_VERSION = $version
          $env:KIN_BASE_URL = ([Uri]($served.Replace('\', '/') + '/')).AbsoluteUri.TrimEnd('/')
          & (Join-Path $staged "install.ps1")
          "$HOME\.kin\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify binaries installed + runnable
        if: inputs.proof_mode == 'candidate-full'
        shell: bash
        env:
          RELEASE_EVENT_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
          LOCAL_ARTIFACT: ${{ inputs.local_artifact || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kin_version_line="$(kin --version)"
          daemon_version_line="$(kin-daemon --version)"
          printf '%s\n' "$kin_version_line" | tee kin-version.txt
          printf '%s\n' "$daemon_version_line" | tee kin-daemon-version.txt

          RUNNER_OS="$RUNNER_OS" node <<'NODE'
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const { execFileSync } = require("child_process");

          const executable = process.env.RUNNER_OS === "Windows" ? "kin.exe" : "kin";
          const installedKin = path.join(os.homedir(), ".kin", "bin", executable);
          if (!fs.statSync(installedKin).isFile()) {
            throw new Error(`public installer did not create a regular Kin launcher at ${installedKin}`);
          }
          const directVersion = execFileSync(installedKin, ["--version"], { encoding: "utf8" }).trim();
          const pathVersion = fs.readFileSync("kin-version.txt", "utf8").trim();
          if (directVersion !== pathVersion) {
            throw new Error(`PATH selected ${pathVersion}, but the installed launcher reports ${directVersion}`);
          }
          fs.writeFileSync("installed-kin-command.txt", `${installedKin}\n`);
          NODE

          installed_version="$(printf '%s\n' "$kin_version_line" | awk '{print $2}')"
          installed_daemon_version="$(printf '%s\n' "$daemon_version_line" | awk '{print $2}')"

          if [ -n "$LOCAL_ARTIFACT" ]; then
            staged="$RUNNER_TEMP/kin-pull-request-release"
            cp "$staged/expected-version.txt" "$staged/expected-commit.txt" \
              "$staged/expected-lock-sha.txt" .
            expected_version="$(cat expected-version.txt)"
            if [ "$installed_version" != "$expected_version" ]; then
              echo "installed kin $installed_version, expected pull request build $expected_version" >&2
              exit 1
            fi
            if [ "$installed_daemon_version" != "$expected_version" ]; then
              echo "installed kin-daemon $installed_daemon_version, expected pull request build $expected_version" >&2
              exit 1
            fi
            printf 'false\n' > legacy-vfs-mode.txt
            exit 0
          fi

          expected_tag="$RELEASE_EVENT_TAG"
          if [ -z "$expected_tag" ]; then
            latest_url="$(curl -fsSLI \
              --retry 5 --retry-all-errors --retry-delay 2 \
              -o /dev/null -w '%{url_effective}' \
              https://github.com/kinlab-ai/kin/releases/latest)"
            expected_tag="${latest_url##*/}"
            printf '%s\n' "$latest_url" > latest-release-url.txt
          fi
          case "$expected_tag" in
            v[0-9]*) ;;
            *) echo "could not resolve a version tag from '$expected_tag'" >&2; exit 1 ;;
          esac

          tag_refs="$(git ls-remote --tags https://github.com/kinlab-ai/kin.git \
            "refs/tags/$expected_tag" "refs/tags/$expected_tag^{}")"
          expected_commit="$(printf '%s\n' "$tag_refs" | awk '$2 ~ /\^\{\}$/ {print $1; exit}')"
          if [ -z "$expected_commit" ]; then
            expected_commit="$(printf '%s\n' "$tag_refs" | awk 'NR == 1 {print $1}')"
          fi
          if ! printf '%s\n' "$expected_commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "could not resolve the 40-hex commit for $expected_tag" >&2
            exit 1
          fi

          expected_version="${expected_tag#v}"
          if [ "$installed_version" != "$expected_version" ]; then
            echo "installed kin $installed_version, expected latest release $expected_version" >&2
            exit 1
          fi
          if [ "$installed_daemon_version" != "$expected_version" ]; then
            echo "installed kin-daemon $installed_daemon_version, expected latest release $expected_version" >&2
            exit 1
          fi
          printf '%s\n' "$expected_version" > expected-version.txt
          printf '%s\n' "$expected_commit" > expected-commit.txt

          EXPECTED_COMMIT="$expected_commit" node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");

          (async () => {
            const url = `https://raw.githubusercontent.com/kinlab-ai/kin/${process.env.EXPECTED_COMMIT}/Cargo.lock`;
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`failed to fetch release Cargo.lock: ${response.status} ${response.statusText}`);
            }
            const lock = Buffer.from(await response.arrayBuffer());
            const digest = crypto.createHash("sha256").update(lock).digest("hex");
            fs.writeFileSync("expected-lock-sha.txt", `${digest}\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) release_asset="kin-linux-x86_64.tar.gz" ;;
            Linux/ARM64) release_asset="kin-linux-aarch64.tar.gz" ;;
            macOS/X64) release_asset="kin-macos-x86_64.tar.gz" ;;
            macOS/ARM64) release_asset="kin-macos-aarch64.tar.gz" ;;
            Windows/X64) release_asset="kin-windows-x86_64.zip" ;;
            *) echo "unsupported install-proof runner $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/kinlab-ai/kin/releases/download/$expected_tag/$release_asset" \
            -o "attested-$release_asset"

          verified=false
          for attempt in $(seq 1 18); do
            if gh attestation verify "attested-$release_asset" \
              --repo kinlab-ai/kin \
              --signer-workflow kinlab-ai/kin/.github/workflows/release.yml \
              --signer-digest "$expected_commit" \
              --source-ref "refs/tags/$expected_tag" \
              --source-digest "$expected_commit" \
              --deny-self-hosted-runners \
              --format json > attestation-verification.json; then
              verified=true
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "release attestation did not become verifiable" >&2
              exit 1
            fi
            sleep 10
          done
          test "$verified" = true

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/kinlab-ai/kin/releases/download/$expected_tag/release-provenance.json" \
            -o release-provenance.json
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/kinlab-ai/kin/releases/download/$expected_tag/release-provenance.json.sha256" \
            -o release-provenance.json.sha256

          RELEASE_ASSET="$release_asset" EXPECTED_TAG="$expected_tag" \
          EXPECTED_COMMIT="$expected_commit" RUNNER_OS="$RUNNER_OS" node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");

          const fail = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const sha256 = (file) =>
            crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const sidecar = fs.readFileSync("release-provenance.json.sha256", "utf8").trim();
          const sidecarMatch = sidecar.match(/^([0-9a-f]{64})\s+\*?release-provenance\.json$/);
          fail(sidecarMatch, "release provenance checksum sidecar is malformed");
          fail(sidecarMatch[1] === sha256("release-provenance.json"),
            "release provenance checksum does not match its public sidecar");

          const manifest = JSON.parse(fs.readFileSync("release-provenance.json", "utf8"));
          fail(manifest.schema_version === 2, "release provenance schema is unsupported");
          fail(manifest.release_tag === process.env.EXPECTED_TAG,
            "release provenance tag does not match the installed release");
          fail(manifest.kin?.commit === process.env.EXPECTED_COMMIT,
            "release provenance Kin commit does not match the installed release tag");
          const platform = manifest.artifacts?.find(
            (artifact) => artifact.archive?.name === process.env.RELEASE_ASSET
          );
          fail(platform, `release provenance omits ${process.env.RELEASE_ASSET}`);
          fail(Array.isArray(platform.archive_contents),
            "release provenance omits the archive content inventory");
          fail(platform.release_tag === process.env.EXPECTED_TAG,
            "platform provenance tag does not match the installed release");
          fail(platform.kin?.commit === process.env.EXPECTED_COMMIT,
            "platform provenance Kin commit does not match the installed release");
          fail(platform.archive?.sha256 === sha256(`attested-${process.env.RELEASE_ASSET}`),
            "attested archive bytes do not match aggregate release provenance");
          const shim = process.env.RUNNER_OS === "Linux"
            ? "libkin_vfs_shim.so"
            : process.env.RUNNER_OS === "macOS"
              ? "libkin_vfs_shim.dylib"
              : null;
          const names = new Set((platform.archive_contents ?? []).map((entry) => entry.name));
          const hasVfs = names.has("kin-vfs");
          const hasShim = shim !== null && names.has(shim);
          fail(hasVfs === hasShim,
            "archive carries a partial retired VFS runtime pair");
          const legacyVfs = hasVfs && hasShim;
          const legacyVfsSource = manifest.kin_vfs !== undefined || platform.kin_vfs !== undefined;
          if (legacyVfs || legacyVfsSource) {
            const expectedVfsCommit = manifest.kin_vfs?.commit;
            fail(/^[0-9a-f]{40}$/.test(expectedVfsCommit ?? ""),
              "legacy release provenance does not bind a reviewed kin-vfs commit");
            fail(manifest.kin_vfs?.dirty === false,
              "legacy release provenance does not certify a clean kin-vfs checkout");
            fail(platform.kin_vfs?.commit === expectedVfsCommit,
              "legacy platform provenance does not bind the reviewed kin-vfs commit");
            fail(legacyVfs || process.env.RUNNER_OS === "Windows",
              "legacy VFS provenance may omit the runtime pair only on Windows");
          } else {
            fail(!names.has("kin-vfs"), "new archive unexpectedly carries kin-vfs");
            fail(shim === null || !names.has(shim), "new archive unexpectedly carries a VFS preload shim");
            fail(manifest.kin_vfs === undefined && platform.kin_vfs === undefined,
              "new release provenance unexpectedly records retired VFS source inputs");
          }
          fs.writeFileSync("legacy-vfs-mode.txt", `${legacyVfs}\n`);
          NODE

          aggregate_verified=false
          for attempt in $(seq 1 18); do
            if gh attestation verify release-provenance.json \
              --repo kinlab-ai/kin \
              --signer-workflow kinlab-ai/kin/.github/workflows/release.yml \
              --signer-digest "$expected_commit" \
              --source-ref "refs/tags/$expected_tag" \
              --source-digest "$expected_commit" \
              --deny-self-hosted-runners \
              --format json > release-provenance-attestation.json; then
              aggregate_verified=true
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "aggregate release provenance attestation did not become verifiable" >&2
              exit 1
            fi
            sleep 10
          done
          test "$aggregate_verified" = true

          content_root=""
          shim_name=""
          if [ "$RUNNER_OS" != "Windows" ]; then
            extract_root="$RUNNER_TEMP/attested-release"
            rm -rf "$extract_root"
            mkdir -p "$extract_root"
            tar -xzf "attested-$release_asset" -C "$extract_root"
            artifact_name="${release_asset%.tar.gz}"
            content_root="$extract_root/$artifact_name"
            test -d "$content_root"
            case "$RUNNER_OS" in
              Linux) shim_name="libkin_vfs_shim.so" ;;
              macOS) shim_name="libkin_vfs_shim.dylib" ;;
              *) echo "unsupported Unix runner $RUNNER_OS" >&2; exit 1 ;;
            esac
          fi

          RUN_COMPONENT_COMPARE="$([ "$RUNNER_OS" != "Windows" ] && printf true || printf false)" \
          LEGACY_VFS="$(cat legacy-vfs-mode.txt)" \
          RELEASE_ASSET="$release_asset" EXPECTED_TAG="$expected_tag" \
          EXPECTED_COMMIT="$expected_commit" CONTENT_ROOT="$content_root" \
          INSTALLED_VFS="$HOME/.kin/bin/kin-vfs" \
          INSTALLED_SHIM="$HOME/.kin/lib/$shim_name" \
          SHIM_NAME="$shim_name" node <<'NODE'
          if (process.env.RUN_COMPONENT_COMPARE !== "true" || process.env.LEGACY_VFS !== "true") process.exit(0);
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");

          const fail = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const sha256Bytes = (bytes) => crypto.createHash("sha256").update(bytes).digest("hex");
          const manifest = JSON.parse(fs.readFileSync("release-provenance.json", "utf8"));
          const platform = manifest.artifacts.find(
            (artifact) => artifact.archive?.name === process.env.RELEASE_ASSET
          );
          const records = new Map(platform.archive_contents.map((entry) => [entry.name, entry]));
          const components = [
            { name: "kin-vfs", installed: process.env.INSTALLED_VFS },
            { name: process.env.SHIM_NAME, installed: process.env.INSTALLED_SHIM },
          ].map((component) => {
            const archived = path.join(process.env.CONTENT_ROOT, component.name);
            const installedBytes = fs.readFileSync(component.installed);
            const archivedBytes = fs.readFileSync(archived);
            fail(installedBytes.equals(archivedBytes),
              `installed ${component.name} differs from the attested public archive`);
            const digest = sha256Bytes(installedBytes);
            fail(records.get(component.name)?.sha256 === digest,
              `installed ${component.name} hash differs from aggregate release provenance`);
            return {
              name: component.name,
              installed_path: component.installed,
              sha256: digest,
            };
          });
          fs.writeFileSync("installed-vfs-provenance.json", `${JSON.stringify({
            schema_version: 1,
            release_tag: process.env.EXPECTED_TAG,
            kin_commit: process.env.EXPECTED_COMMIT,
            kin_vfs_commit: platform.kin_vfs?.commit,
            archive: process.env.RELEASE_ASSET,
            components,
          }, null, 2)}\n`);
          NODE

      - name: Windows admission contract proof
        if: inputs.proof_mode == 'candidate-full' && (runner.os == 'Windows')
        shell: bash
        run: |
          set -euo pipefail
          NON_EMPTY_REFUSAL="requires an empty directory"

          scratch="kin-windows-admission"
          mkdir -p "$scratch"
          scratch="$(cd "$scratch" && pwd)"

          failures=0
          fail() {
            failures=$((failures + 1))
            echo "::error::$1"
            echo "--- captured kin init output: $2 ---"
            cat "$2" || true
            echo "--- end $2 ---"
          }
          occurrences() {
            grep -Fc -- "$1" "$2" || true
          }
          require_text() {
            if [ "$(occurrences "$2" "$3")" -eq 0 ]; then
              fail "$1 did not report: $2" "$3"
            fi
          }
          count_matching() {
            local matches=0
            local entry
            for entry in "$1"/$2; do
              if [ -e "$entry" ]; then
                matches=$((matches + 1))
              fi
            done
            echo "$matches"
          }
          require_no_stage_residue() {
            local parent
            parent="$(dirname "$2")"
            local stores
            stores="$(fixture_home "$2")/stores"
            local staged
            staged="$(count_matching "$parent" '.kin.init-*')"
            if [ "$staged" != "0" ]; then
              fail "$1 left $staged unpublished stage entries in $parent" "$3"
            fi
            staged="$(count_matching "$stores" '.kin.init-*')"
            if [ "$staged" != "0" ]; then
              fail "$1 left $staged unpublished stage entries in $stores" "$3"
            fi
          }
          fixture_home() {
            printf '%s\n' "$(dirname "$1")/kin-home"
          }
          fixture_kin() {
            local dir="$1"
            local layout="$2"
            shift 2
            local home
            home="$(fixture_home "$dir")"
            if command -v cygpath > /dev/null 2>&1; then
              home="$(cygpath -w "$home")"
            fi
            (
              cd "$dir"
              export KIN_HOME="$home"
              if [ "$layout" = "in-tree" ]; then
                export KIN_STORE_LAYOUT=in-tree
              fi
              "$@"
            )
          }
          discovered_store() {
            local answer
            if ! answer="$(fixture_kin "$1" "$2" kin store path 2>> "$3")"; then
              return 0
            fi
            answer="$(printf '%s\n' "$answer" | tr -d '\r' | tail -n 1)"
            answer="${answer#'\\?\'}"
            if [ -n "$answer" ] && command -v cygpath > /dev/null 2>&1; then
              answer="$(cygpath -u "$answer")"
            fi
            printf '%s\n' "$answer"
          }
          make_git_fixture() {
            mkdir -p "$1"
            (
              cd "$1"
              git init -q
              git config user.email ci@firelock.ai
              git config user.name ci
              printf 'fn probe() {}\n' > probe.rs
              git add probe.rs
              git -c core.hooksPath= -c commit.gpgsign=false commit -qm probe
            )
          }
          require_admitted() {
            local layout="${4:-central}"
            local home
            local store
            home="$(fixture_home "$2")"
            if ! fixture_kin "$2" "$layout" kin init > "$3" 2>&1; then
              fail "$1 failed" "$3"
            fi
            store="$(discovered_store "$2" "$layout" "$3")"
            if [ -z "$store" ]; then
              fail "$1 returned success but no store serves $2" "$3"
            elif [ ! -f "$store/manifest.json" ]; then
              fail "$1 returned success but the store serving $2 holds no manifest: $store" "$3"
            fi
            if [ "$layout" = "in-tree" ]; then
              if [ ! -d "$2/.kin" ]; then
                fail "$1 returned success without publishing $2/.kin" "$3"
              elif [ -n "$store" ] && [ "$(basename "$store")" != ".kin" ]; then
                fail "$1 is served by $store instead of $2/.kin" "$3"
              fi
            else
              if [ -e "$2/.kin" ]; then
                fail "$1 wrote $2/.kin although the default layout keeps the working tree clean" "$3"
              fi
              if [ "$(count_matching "$home/stores" '*/manifest.json')" != "1" ]; then
                fail "$1 did not publish exactly one store in $home/stores" "$3"
              elif [ -n "$store" ] && [ ! -f "$home/stores/$(basename "$store")/manifest.json" ]; then
                fail "$1 is served by $store instead of its store in $home/stores" "$3"
              fi
            fi
            require_no_stage_residue "$1" "$2" "$3"
          }
          require_refused() {
            local home
            home="$(fixture_home "$2")"
            if fixture_kin "$2" central kin init > "$3" 2>&1; then
              fail "$1 unexpectedly succeeded" "$3"
            fi
            if [ -e "$2/.kin" ]; then
              fail "$1 published authority at $2/.kin" "$3"
            fi
            if [ "$(count_matching "$home/stores" '*/manifest.json')" != "0" ]; then
              fail "$1 published a store in $home/stores" "$3"
            fi
            if [ -n "$(discovered_store "$2" central "$3")" ]; then
              fail "$1 left a store serving $2" "$3"
            fi
            require_no_stage_residue "$1" "$2" "$3"
            require_text "$1" "$NON_EMPTY_REFUSAL" "$3"
          }

          git_boundary="$scratch/exact-git/repo"
          git_log="$scratch/kin-init-exact-git.txt"
          make_git_fixture "$git_boundary"
          require_admitted "Windows exact-Git admission" "$git_boundary" "$git_log"

          in_tree_boundary="$scratch/exact-git-in-tree/repo"
          in_tree_log="$scratch/kin-init-exact-git-in-tree.txt"
          make_git_fixture "$in_tree_boundary"
          require_admitted "Windows in-tree exact-Git admission" "$in_tree_boundary" "$in_tree_log" in-tree

          native_boundary="$scratch/native-unborn/repo"
          native_log="$scratch/kin-init-native-unborn.txt"
          mkdir -p "$native_boundary"
          require_admitted "Windows native-unborn bootstrap" "$native_boundary" "$native_log"

          populated_boundary="$scratch/native-populated/repo"
          populated_log="$scratch/kin-init-native-populated.txt"
          mkdir -p "$populated_boundary"
          printf 'untracked\n' > "$populated_boundary/stray.txt"
          require_refused "Windows non-empty native boundary" "$populated_boundary" "$populated_log"

          if [ "$failures" -ne 0 ]; then
            echo "::error::the installed Windows release violated its admission contract ($failures check(s) failed)"
            exit 1
          fi
          echo "Installed Windows release admitted exact Git and native-empty repositories into central stores and exact Git into its own .kin, without stage residue, and refused the non-empty native boundary."

      - name: Windows repo-free provenance and setup proof
        if: inputs.proof_mode == 'candidate-full' && (runner.os == 'Windows')
        shell: bash
        env:
          PROOF_SHELL: ${{ matrix.setup-shell }}
        run: |
          set -euo pipefail
          kin bench-meta --json > kin-windows-bench-meta.json
          cat kin-windows-bench-meta.json
          kin registry authority --json > kin-windows-registry-authority.json
          cat kin-windows-registry-authority.json
          if kin registry authority --fix > kin-windows-registry-fix.txt 2>&1; then
            cat kin-windows-registry-fix.txt >&2
            echo "installed Windows kin reported registry authority --fix succeeded on a platform that does not support it" >&2
            exit 1
          fi
          cat kin-windows-registry-fix.txt

          fake_agent_bin="$RUNNER_TEMP/kin-proof-agent-bin"
          mkdir -p "$fake_agent_bin"
          for agent in claude cursor codex gemini windsurf agy; do
            cp "$(command -v kin)" "$fake_agent_bin/$agent.exe"
          done
          export PATH="$fake_agent_bin:$PATH"

          git config --global user.email ci@firelock.ai
          git config --global user.name ci

          kin setup --no-interactive --intent agent --shell "$PROOF_SHELL" \
            2>&1 | tee kin-windows-setup.txt
          kin setup status --json | tee kin-windows-health.json
          kin doctor --json | tee kin-windows-doctor.json

          node <<'NODE'
          const fs = require("fs");
          const os = require("os");
          const path = require("path");

          const expectedCommit = fs.readFileSync("expected-commit.txt", "utf8").trim();
          const expectedLock = fs.readFileSync("expected-lock-sha.txt", "utf8").trim();
          const installedKin = fs.readFileSync("installed-kin-command.txt", "utf8").trim();
          const expectedInstalledKin = path.join(os.homedir(), ".kin", "bin", "kin.exe");
          if (installedKin !== expectedInstalledKin) {
            throw new Error(`installed Kin command proof ${installedKin || "missing"} does not equal ${expectedInstalledKin}`);
          }
          const meta = JSON.parse(fs.readFileSync("kin-windows-bench-meta.json", "utf8"));
          if (meta.kin_commit !== expectedCommit) {
            throw new Error(`installed Windows build SHA ${meta.kin_commit ?? "missing"} does not match release tag ${expectedCommit}`);
          }
          if (meta.kin_dirty !== false) {
            throw new Error("installed Windows release binary is dirty or did not report a clean build");
          }
          if (meta.kin_source_known !== true) {
            throw new Error("installed Windows release binary did not prove source_known=true");
          }
          if (meta.dependency_provenance !== expectedLock) {
            throw new Error(`installed Windows Cargo.lock provenance ${meta.dependency_provenance ?? "missing"} does not match release source ${expectedLock}`);
          }
          if (
            meta.embeddings?.vector_enabled !== true ||
            meta.embeddings?.embeddings_enabled !== true ||
            meta.embeddings?.local_inference_enabled !== false ||
            meta.embeddings?.external_embeddings_enabled !== true ||
            meta.embeddings?.provider !== "none" ||
            meta.embeddings?.metal_enabled !== false
          ) {
            throw new Error("installed Windows CLI does not prove the vector feature contract");
          }

          const authority = JSON.parse(fs.readFileSync("kin-windows-registry-authority.json", "utf8"));
          if (authority.checks?.length !== 1 || authority.checks[0]?.state !== "unsupported") {
            throw new Error(`Windows registry authority must report exactly one unsupported capability check: ${JSON.stringify(authority.checks ?? null)}`);
          }

          const healthNeedsAttention = (check) =>
            check.status !== "healthy" && check.status !== "unsupported";
          const healthBlocksReadiness = (check) =>
            check.status === "missing" ||
            check.status === "misconfigured" ||
            (check.id === "semantic_query_readiness" && check.status === "stale");
          const healthJoin = (checks) => {
            if (checks.some(healthBlocksReadiness)) return "failing";
            return checks.some(healthNeedsAttention) ? "needs_attention" : "ready";
          };
          const attentionRows = (report) => (report.checks ?? [])
            .filter(healthNeedsAttention)
            .map((check) => `${check.id}=${check.status}`)
            .join(", ") || "none";
          const validateHealthReport = (report, reportPath) => {
            if (!Array.isArray(report.checks)) {
              throw new Error(`${reportPath}: checks is missing or malformed`);
            }
            const checks = new Map(report.checks.map((check) => [check.id, check]));
            if (checks.size !== report.checks.length) {
              throw new Error(`${reportPath}: duplicate health-check ids are not authoritative`);
            }
            if (report.verdict === undefined) {
              throw new Error(
                `${reportPath}: the report carries no verdict field, so these bytes predate the health-join update and their aggregate cannot be graded against the health join`
              );
            }
            const verdict = healthJoin(report.checks);
            if (report.verdict !== verdict) {
              throw new Error(`${reportPath}: verdict=${report.verdict} disagrees with checks; expected ${verdict}`);
            }
            if (report.healthy !== (verdict === "ready")) {
              throw new Error(
                `${reportPath}: aggregate healthy=${report.healthy} disagrees with checks; expected ${verdict === "ready"}`
              );
            }
            return checks;
          };
          const required = new Map([
            ["kin_binary", "healthy"],
            ["kin_daemon_binary", "healthy"],
            ["shell_path", "healthy"],
            ["setup_ledger", "healthy"],
            ["commit_author", "healthy"],
            ["registry_authority", "unsupported"],
            ["vfs_projection", "unsupported"],
            ["semantic_query_readiness", "unsupported"],
            ["daemon_running", "unsupported"],
            ["repo_init", "unsupported"],
            ["projection_mode", "unsupported"],
            ["mcp_client_claude", "healthy"],
            ["mcp_client_cursor", "healthy"],
            ["mcp_client_gemini", "healthy"],
            ["mcp_client_windsurf", "healthy"],
          ]);

          for (const reportPath of ["kin-windows-health.json", "kin-windows-doctor.json"]) {
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const checks = validateHealthReport(report, reportPath);
            const firstRunAttention = new Map([
              ["embedding_model", ["pending"]],
              ["memory_floor", ["degraded"]],
            ]);
            const untolerated = report.checks.filter(
              (check) =>
                healthNeedsAttention(check) &&
                !(firstRunAttention.get(check.id) ?? []).includes(check.status)
            );
            if (untolerated.length > 0) {
              throw new Error(
                `${reportPath}: rows needing attention that a fresh repo-free install does not expect: ` +
                `${untolerated.map((check) => `${check.id}=${check.status}`).join(", ")}; ` +
                `verdict=${report.verdict}; every row needing attention: ${attentionRows(report)}`
              );
            }
            for (const [id, expected] of required) {
              const actual = checks.get(id)?.status;
              if (actual !== expected) {
                throw new Error(`${reportPath}: ${id} is ${actual ?? "missing"}, expected ${expected}`);
              }
            }
            const hardFailures = report.checks.filter((check) =>
              check.id !== "repo_init" &&
              (check.status === "missing" || check.status === "misconfigured")
            );
            if (hardFailures.length > 0) {
              throw new Error(`${reportPath}: hard failures: ${hardFailures.map((c) => c.id).join(", ")}`);
            }
            for (const id of ["mcp_client_codex", "mcp_client_antigravity", "mcp_client_antigravity_workspace"]) {
              if (checks.has(id)) {
                throw new Error(`${reportPath}: ${id} is present without a repository, so a repo-bound writer changed`);
              }
            }
          }

          const home = os.homedir();
          const jsonConfigs = [
            [path.join(home, ".claude.json"), "agent-default"],
            [path.join(home, ".cursor", "mcp.json"), "agent-routed"],
            [path.join(home, ".gemini", "settings.json"), "agent-routed"],
            [path.join(home, ".codeium", "windsurf", "mcp_config.json"), "agent-routed"],
          ];
          for (const [configPath, profile] of jsonConfigs) {
            const entry = JSON.parse(fs.readFileSync(configPath, "utf8"))?.mcpServers?.kin;
            if (
              !entry ||
              entry.command !== installedKin ||
              JSON.stringify(entry.args) !== JSON.stringify(["mcp", "start"]) ||
              entry.env?.KIN_MCP_TOOL_PROFILE !== profile
            ) {
              throw new Error(`${configPath}: Kin MCP entry is missing or malformed`);
            }
          }
          for (const forbiddenPath of [
            path.join(home, ".gemini", "config", "mcp_config.json"),
            path.join(home, ".gemini", "antigravity-ide", "mcp_config.json"),
          ]) {
            if (fs.existsSync(forbiddenPath)) {
              throw new Error(`${forbiddenPath}: repo-free Windows setup wrote a repository-bound Antigravity config`);
            }
          }
          NODE

      - name: Provide a tomllib-capable Python for the Codex TOML proof
        if: inputs.proof_mode == 'candidate-full' && (runner.os == 'Windows')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: First-run repository, daemon, and setup proof
        if: inputs.proof_mode == 'candidate-full'
        shell: bash
        env:
          PROOF_SHELL: ${{ matrix.setup-shell }}
        run: |
          set -euo pipefail
          case "$PROOF_SHELL" in
            bash)
              unset PSModulePath PSVersionTable
              export SHELL=/bin/bash
              printf 'SHELL=%s\n' "$SHELL" >> "$GITHUB_ENV"
              ;;
            zsh)
              unset PSModulePath PSVersionTable
              export SHELL=/bin/zsh
              printf 'SHELL=%s\n' "$SHELL" >> "$GITHUB_ENV"
              ;;
            powershell)
              ;;
            *) echo "unsupported install-proof setup shell: $PROOF_SHELL" >&2; exit 1 ;;
          esac

          mkdir -p kin-install-proof && cd kin-install-proof
          git init -q && git config user.email ci@firelock.ai && git config user.name ci
          printf 'def hello():\n    return 42\n' > probe.py
          git add -A && git commit -qm "probe"
          captures="$RUNNER_TEMP/kin-proof-captures"
          mkdir -p "$captures"
          init_status=0
          kin init > "$captures/kin-init.txt" 2>&1 || init_status=$?
          cat "$captures/kin-init.txt"
          if [ "$init_status" -ne 0 ]; then exit "$init_status"; fi
          set +e
          kin status > "$captures/kin-status.txt" 2>&1
          status_rc=$?
          kin status --json > "$captures/kin-status.json" 2> "$captures/kin-status-json.stderr.txt"
          status_json_rc=$?
          set -e
          cat "$captures/kin-status.txt"
          cat "$captures/kin-status.json"
          cat "$captures/kin-status-json.stderr.txt" >&2
          printf 'kin status rc=%s / kin status --json rc=%s (9 = working copy unmeasured)\n' \
            "$status_rc" "$status_json_rc" > "$captures/kin-status-exit.txt"
          cat "$captures/kin-status-exit.txt"
          for rc in "$status_rc" "$status_json_rc"; do
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 9 ]; then exit "$rc"; fi
          done
          kin bench-meta --json > "$captures/kin-build-meta.json"
          cat "$captures/kin-build-meta.json"
          proof_base_path="$PATH"
          fake_agent_bin="$RUNNER_TEMP/kin-proof-agent-bin"
          mkdir -p "$fake_agent_bin"
          for agent in claude cursor codex gemini windsurf agy; do
            if [ "$RUNNER_OS" = "Windows" ]; then
              cp "$(command -v kin)" "$fake_agent_bin/$agent.exe"
            else
              printf '#!/bin/sh\nexit 0\n' > "$fake_agent_bin/$agent"
              chmod +x "$fake_agent_bin/$agent"
            fi
          done
          export PATH="$fake_agent_bin:$proof_base_path"
          printf '%s\n' "$fake_agent_bin" >> "$GITHUB_PATH"

          antigravity_legacy="$HOME/.gemini/antigravity-ide/mcp_config.json"
          mkdir -p "$(dirname "$antigravity_legacy")"
          ANTIGRAVITY_LEGACY="$antigravity_legacy" node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const config = {
            userPolicy: "preserve",
            mcpServers: {
              kin: {
                command: "/stale/kin",
                args: ["mcp", "start"],
                cwd: fs.realpathSync(process.cwd()),
                env: { USER_POLICY: "preserve" },
              },
            },
          };
          fs.writeFileSync(process.env.ANTIGRAVITY_LEGACY, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          setup_status=0
          kin setup --no-interactive --intent agent --shell "$PROOF_SHELL" \
            > "$captures/kin-setup.txt" 2>&1 || setup_status=$?
          cat "$captures/kin-setup.txt"
          if [ "$setup_status" -ne 0 ]; then exit "$setup_status"; fi

          CODEX_CONFIG="$HOME/.codex/config.toml" PROOF_CAPTURES="$captures" python3 - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          config = pathlib.Path(os.environ["CODEX_CONFIG"])
          with config.open("rb") as handle:
              entry = tomllib.load(handle)["mcp_servers"]["kin"]
          pathlib.Path(os.environ["PROOF_CAPTURES"], "kin-codex-config.json").write_text(
              json.dumps({"mcpServers": {"kin": entry}}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          primary_home="$HOME"
          claude_fallback_home="$RUNNER_TEMP/kin-proof-claude-fallback-home"
          claude_fallback_bin="$RUNNER_TEMP/kin-proof-claude-fallback-bin"
          mkdir -p "$claude_fallback_home/.claude"
          mkdir -p "$claude_fallback_bin"
          printf '{}\n' > "$claude_fallback_home/.claude/config.json"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$(command -v kin)" "$claude_fallback_bin/claude.exe"
          else
            printf '#!/bin/sh\nexit 0\n' > "$claude_fallback_bin/claude"
            chmod +x "$claude_fallback_bin/claude"
          fi
          claude_fallback_path="$claude_fallback_bin:$primary_home/.kin/bin:/usr/bin:/bin"
          fallback_setup_status=0
          HOME="$claude_fallback_home" USERPROFILE="$claude_fallback_home" \
          KIN_HOME="$primary_home/.kin" PATH="$claude_fallback_path" \
            kin setup --no-interactive --intent agent --shell "$PROOF_SHELL" \
            > "$captures/kin-claude-fallback-setup.txt" 2>&1 || fallback_setup_status=$?
          cat "$captures/kin-claude-fallback-setup.txt"
          if [ "$fallback_setup_status" -ne 0 ]; then exit "$fallback_setup_status"; fi
          if [ -e "$claude_fallback_home/.claude.json" ]; then
            echo "Claude fallback proof unexpectedly wrote the primary ~/.claude.json path" >&2
            exit 1
          fi
          cp "$claude_fallback_home/.claude/config.json" "$captures/kin-claude-fallback-config.json"
          HOME="$claude_fallback_home" USERPROFILE="$claude_fallback_home" \
          KIN_HOME="$primary_home/.kin" PATH="$claude_fallback_path" \
            kin setup status --json > "$captures/kin-claude-fallback-health.json"
          HOME="$claude_fallback_home" USERPROFILE="$claude_fallback_home" \
          KIN_HOME="$primary_home/.kin" PATH="$claude_fallback_path" \
            kin doctor --json > "$captures/kin-claude-fallback-doctor.json"

      - name: Graph query and MCP tool-call proof
        if: inputs.proof_mode == 'candidate-full'
        shell: bash
        working-directory: kin-install-proof
        run: |
          set -euo pipefail
          captures="$RUNNER_TEMP/kin-proof-captures"
          mkdir -p "$captures"
          kin search hello --json > "$captures/kin-search.json"
          cat "$captures/kin-search.json"
          kin locate hello --json --explain --max-files 5 > "$captures/kin-locate.json"
          cat "$captures/kin-locate.json"

          if kin store path --help > /dev/null 2>&1; then
            kin store path > "$captures/kin-store-path.txt"
            store_dir="$(tr -d '\r' < "$captures/kin-store-path.txt" | tail -n 1)"
            store_dir="${store_dir#'\\?\'}"
            if command -v cygpath > /dev/null 2>&1; then
              store_dir="$(cygpath -u "$store_dir")"
            fi
          else
            store_dir=.kin
          fi
          daemon_port="$(tr -d '[:space:]' < "$store_dir/daemon.port")"
          case "$daemon_port" in
            ''|*[!0-9]*)
              echo "installed daemon published an invalid port: $daemon_port" >&2
              exit 1
              ;;
          esac
          DAEMON_PORT="$daemon_port" node <<'NODE' > "$captures/kin-daemon-health.json"
          const http = require("http");
          const request = http.get(
            `http://127.0.0.1:${process.env.DAEMON_PORT}/health`,
            (response) => {
              const chunks = [];
              response.on("data", (chunk) => chunks.push(chunk));
              response.on("end", () => {
                const body = Buffer.concat(chunks);
                if (response.statusCode !== 200) {
                  console.error(`daemon health returned HTTP ${response.statusCode}: ${body}`);
                  process.exitCode = 1;
                  return;
                }
                process.stdout.write(body);
              });
            }
          );
          request.setTimeout(30000, () => {
            request.destroy(new Error("daemon health request exceeded 30 seconds"));
          });
          request.on("error", (error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
          cat "$captures/kin-daemon-health.json"
          kin setup status --json | tee "$captures/kin-health.json"
          kin doctor --json | tee "$captures/kin-doctor.json"

          PROOF_CAPTURES="$captures" node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const { execFileSync, spawn, spawnSync } = require("child_process");

          const captures = process.env.PROOF_CAPTURES;

          const resolver = process.platform === "win32"
            ? ["where.exe", ["kin"]]
            : ["sh", ["-c", "command -v kin"]];
          const resolved = execFileSync(resolver[0], resolver[1], { encoding: "utf8" })
            .split(/\r?\n/)
            .map((line) => line.trim())
            .find(Boolean);
          if (!resolved) throw new Error("could not resolve the installed Kin binary");
          const kinBinary = fs.realpathSync(resolved);
          const installDir = path.dirname(kinBinary);
          const normalizePath = (value) => {
            let normalized;
            try {
              normalized = fs.realpathSync(value);
            } catch {
              normalized = path.resolve(value);
            }
            return process.platform === "win32" ? normalized.toLowerCase() : normalized;
          };
          const proofEnv = { ...process.env };
          delete proofEnv.KIN_DAEMON_BIN;
          const pathKey = Object.keys(proofEnv).find((key) => key.toUpperCase() === "PATH") ?? "PATH";
          proofEnv[pathKey] = (proofEnv[pathKey] ?? "")
            .split(path.delimiter)
            .filter((entry) => entry && normalizePath(entry) !== normalizePath(installDir))
            .join(path.delimiter);
          if ((proofEnv[pathKey] ?? "")
            .split(path.delimiter)
            .some((entry) => entry && normalizePath(entry) === normalizePath(installDir))) {
            throw new Error("PATH-free MCP proof still contains the Kin install directory");
          }

          const stopDaemons = (phase) => {
            const stopped = spawnSync(
              kinBinary,
              ["daemon", "stop", "--all", "--json"],
              {
                cwd: process.cwd(),
                env: proofEnv,
                encoding: "utf8",
                timeout: 60_000,
              },
            );
            fs.appendFileSync(
              path.join(captures, "kin-mcp-daemon-stop.txt"),
              `${phase}: status=${stopped.status}\n${stopped.stdout ?? ""}${stopped.stderr ?? ""}\n`,
            );
            if (stopped.error || stopped.status !== 0) {
              throw new Error(
                `${phase}: failed to stop installed daemons: ${stopped.error ?? stopped.stderr}`,
              );
            }
          };

          stopDaemons("before MCP startup");

          const searchArgs = { query: "hello", mode: "name", compact: true, limit: 5 };
          const searchCall = (profile) => (
            typeof profile === "string" && profile.startsWith("agent-routed")
              ? { name: "kin", arguments: { command: "locate", args: searchArgs } }
              : { name: "locate", arguments: searchArgs }
          );
          const searchLabel = (call) => (
            call.name === "kin" ? `kin ${call.arguments.command}` : call.name
          );
          const requests = [
            { jsonrpc: "2.0", id: 1, method: "initialize", params: {} },
            { jsonrpc: "2.0", method: "notifications/initialized", params: {} },
            { jsonrpc: "2.0", id: 2, method: "tools/list", params: {} },
          ];

          const configPath = path.join(process.cwd(), ".agents", "mcp_config.json");
          const entry = JSON.parse(fs.readFileSync(configPath, "utf8"))?.mcpServers?.kin;
          if (!entry || typeof entry.command !== "string" || !Array.isArray(entry.args) || typeof entry.cwd !== "string") {
            throw new Error(`${configPath}: captured MCP launch entry is missing`);
          }
          const launchProfile = entry.env?.KIN_MCP_TOOL_PROFILE;
          const launchCall = searchCall(launchProfile);
          const launchLabel = searchLabel(launchCall);
          const stripVerbatim = (p) => (typeof p === "string" && p.startsWith("\\\\?\\") ? p.slice(4) : p);
          const child = spawn(entry.command, entry.args, {
            cwd: stripVerbatim(entry.cwd),
            env: { ...proofEnv, ...(entry.env ?? {}) },
            stdio: ["pipe", "pipe", "pipe"],
          });
          let stdout = "";
          let stderr = "";
          let lineBuffer = "";
          let revivalRequested = false;
          let settled = false;
          const finish = (error) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            fs.writeFileSync(path.join(captures, "kin-mcp-out.jsonl"), stdout);
            fs.writeFileSync(path.join(captures, "kin-mcp-err.txt"), stderr);
            if (error) {
              if (!child.killed) child.kill("SIGKILL");
              console.error(error);
              console.error(stderr);
              process.exit(1);
            }
          };
          const timer = setTimeout(() => {
            child.kill("SIGKILL");
            finish(new Error("installed MCP startup/revival proof did not exit within 120 seconds"));
          }, 120_000);
          const holdsEntity = (value, name, module) => {
            if (Array.isArray(value)) return value.some((item) => holdsEntity(item, name, module));
            if (value && typeof value === "object") {
              if (value.name === name && value.module === module) return true;
              return Object.values(value).some((item) => holdsEntity(item, name, module));
            }
            return false;
          };
          const validateSearch = (message, label) => {
            if (!message?.result || message.error || message.result.isError === true) {
              throw new Error(`${label} failed: ${JSON.stringify(message ?? null)}`);
            }
            const replies = (message.result.content ?? []).flatMap((block) => {
              try {
                return [JSON.parse(block?.text)];
              } catch {
                return [];
              }
            });
            if (!holdsEntity(replies, "hello", "probe")) {
              throw new Error(
                `${label} did not return the seeded hello entity in module probe: ` +
                JSON.stringify(message.result).slice(0, 500)
              );
            }
          };
          child.stdout.on("data", (chunk) => {
            const text = chunk.toString();
            stdout += text;
            lineBuffer += text;
            const lines = lineBuffer.split(/\r?\n/);
            lineBuffer = lines.pop() ?? "";
            try {
              for (const line of lines) {
                if (!line.trim().startsWith("{")) continue;
                const message = JSON.parse(line);
                if (message.id === 3 && !revivalRequested) {
                  validateSearch(message, `initial MCP ${launchLabel}`);
                  stopDaemons("between MCP calls");
                  revivalRequested = true;
                  child.stdin.write(`${JSON.stringify({
                    jsonrpc: "2.0",
                    id: 4,
                    method: "tools/call",
                    params: launchCall,
                  })}\n`);
                } else if (message.id === 4) {
                  validateSearch(message, `revived MCP ${launchLabel}`);
                  child.stdin.end();
                }
              }
            } catch (error) {
              finish(error);
            }
          });
          child.stderr.on("data", (chunk) => { stderr += chunk; });
          child.on("error", finish);
          child.on("close", (code) => {
            if (code !== 0) {
              finish(new Error(`installed MCP server exited ${code}`));
              return;
            }
            try {
              const messages = stdout
                .split(/\r?\n/)
                .filter((line) => line.trim().startsWith("{"))
                .map((line) => JSON.parse(line));
              const byId = new Map(messages.filter((message) => message.id != null).map((message) => [message.id, message]));
              if (!byId.get(1)?.result) throw new Error("MCP initialize response missing");
              const listedTools = byId.get(2)?.result?.tools;
              if (!Array.isArray(listedTools) || !listedTools.some((tool) => tool?.name === launchCall.name)) {
                throw new Error(
                  `MCP tools/list omitted ${launchCall.name}, the tool the launched ` +
                  `${launchProfile ?? "default"} profile serves`
                );
              }
              validateSearch(byId.get(3), `initial MCP ${launchLabel}`);
              if (!revivalRequested) throw new Error("MCP daemon revival was not exercised");
              validateSearch(byId.get(4), `revived MCP ${launchLabel}`);
              finish();
            } catch (error) {
              finish(error);
            }
          });
          requests.push({
            jsonrpc: "2.0",
            id: 3,
            method: "tools/call",
            params: launchCall,
          });
          child.stdin.write(`${requests.map((request) => JSON.stringify(request)).join("\n")}\n`);
          NODE

      - name: Graph-backed VFS projection proof
        if: inputs.proof_mode == 'candidate-full' && (runner.os != 'Windows' && !inputs.local_artifact)
        shell: bash
        working-directory: kin-install-proof
        run: |
          set -euo pipefail
          if [ "$(cat ../legacy-vfs-mode.txt)" != true ]; then
            echo "retired VFS runtime absent from this archive; projection proof is unsupported by contract"
            exit 0
          fi
          captures="$RUNNER_TEMP/kin-proof-captures"
          mkdir -p "$captures"
          probe_bin="$RUNNER_TEMP/vfs-open-probe"
          cc -O2 -Wall -Wextra -Werror -x c -o "$probe_bin" - <<'C'

          int main(int argc, char **argv) {
              if (argc != 2) {
                  fputs("usage: vfs-open-probe <path>\n", stderr);
                  return 2;
              }

              struct stat stdout_stat;
              if (fstat(STDOUT_FILENO, &stdout_stat) != 0) {
                  perror("fstat(stdout)");
                  return 3;
              }

              int fd = open(argv[1], O_RDONLY);
              if (fd < 0) {
                  perror("open");
                  return 4;
              }

              char buffer[4096];
              for (;;) {
                  ssize_t count = read(fd, buffer, sizeof(buffer));
                  if (count == 0) {
                      break;
                  }
                  if (count < 0) {
                      if (errno == EINTR) {
                          continue;
                      }
                      perror("read");
                      close(fd);
                      return 5;
                  }
                  for (ssize_t written = 0; written < count;) {
                      ssize_t step = write(STDOUT_FILENO, buffer + written, (size_t)(count - written));
                      if (step < 0 && errno == EINTR) {
                          continue;
                      }
                      if (step <= 0) {
                          perror("write");
                          close(fd);
                          return 6;
                      }
                      written += step;
                  }
              }

              if (close(fd) != 0) {
                  perror("close");
                  return 7;
              }
              return 0;
          }
          C

          vfs_pid=""
          cleanup_vfs() {
            cleanup_status=0
            chmod u+rw probe.py || cleanup_status=1
            if [ -n "$vfs_pid" ]; then
              kin-vfs stop --workspace . >> "$captures/kin-vfs-daemon.log" 2>&1 || cleanup_status=1
              stopped=false
              for _ in $(seq 1 150); do
                process_state="$(ps -o stat= -p "$vfs_pid" 2>/dev/null || true)"
                process_state="$(printf '%s' "$process_state" | tr -d '[:space:]')"
                if [ -z "$process_state" ] || printf '%s\n' "$process_state" | grep -q 'Z'; then
                  stopped=true
                  break
                fi
                sleep 0.1
              done
              if [ "$stopped" != true ]; then
                cat "$captures/kin-vfs-daemon.log" >&2
                echo "installed kin-vfs daemon did not stop cleanly" >&2
                kill "$vfs_pid" 2>/dev/null || true
                sleep 1
                kill -9 "$vfs_pid" 2>/dev/null || true
                wait "$vfs_pid" 2>/dev/null || true
                cleanup_status=1
              else
                wait_status=0
                wait "$vfs_pid" || wait_status=$?
                case "$wait_status" in
                  0|143) ;;
                  *)
                    echo "installed kin-vfs daemon exited with unexpected status $wait_status" >&2
                    cleanup_status=1
                    ;;
                esac
              fi
              vfs_pid=""
            fi
            if [ -S .kin/vfs.sock ]; then
              echo "installed kin-vfs socket remained after shutdown" >&2
              cleanup_status=1
            fi
            test -r probe.py || cleanup_status=1
            return "$cleanup_status"
          }
          on_vfs_signal() {
            signal_status="$1"
            trap - EXIT INT TERM
            cleanup_vfs || true
            exit "$signal_status"
          }
          trap 'cleanup_vfs || true' EXIT
          trap 'on_vfs_signal 130' INT
          trap 'on_vfs_signal 143' TERM

          kin-vfs start --workspace . > "$captures/kin-vfs-daemon.log" 2>&1 &
          vfs_pid=$!
          socket_ready=false
          for _ in $(seq 1 150); do
            if [ -S .kin/vfs.sock ]; then
              socket_ready=true
              break
            fi
            if ! kill -0 "$vfs_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if [ "$socket_ready" != true ]; then
            cat "$captures/kin-vfs-daemon.log" >&2
            echo "installed kin-vfs daemon did not bind its socket" >&2
            exit 1
          fi

          chmod 000 probe.py
          set +e
          "$probe_bin" "$PWD/probe.py" > "$captures/vfs-negative.txt" 2>&1
          negative_status=$?
          set -e
          if [ "$negative_status" -ne 4 ]; then
            cat "$captures/vfs-negative.txt" >&2
            echo "negative control failed before the expected raw-disk open denial (status $negative_status)" >&2
            exit 1
          fi
          if ! grep -Eq '^open: (Permission denied|Operation not permitted)$' "$captures/vfs-negative.txt"; then
            cat "$captures/vfs-negative.txt" >&2
            echo "negative control did not fail with the expected raw-disk permission error" >&2
            exit 1
          fi

          KIN_VFS_STRICT=1 kin-vfs exec --workspace . -- \
            "$probe_bin" "$PWD/probe.py" \
            > "$captures/vfs-graph-read.txt" 2> "$captures/vfs-graph-read.stderr.txt"
          printf 'def hello():\n    return 42\n' > "$captures/vfs-expected.txt"
          if ! cmp -s "$captures/vfs-expected.txt" "$captures/vfs-graph-read.txt"; then
            cmp -l "$captures/vfs-expected.txt" "$captures/vfs-graph-read.txt" >&2 || true
            echo "installed VFS did not return the exact graph-owned probe.py bytes" >&2
            exit 1
          fi

          trap - EXIT
          cleanup_vfs
          trap - INT TERM

      - name: Unix embedding and semantic retrieval proof
        if: inputs.proof_mode == 'candidate-full' && (runner.os != 'Windows')
        shell: bash
        working-directory: kin-install-proof
        env:
          PROOF_SHELL: ${{ matrix.setup-shell }}
        run: |
          set -euo pipefail
          case "$PROOF_SHELL" in
            bash)
              unset PSModulePath PSVersionTable
              export SHELL=/bin/bash
              ;;
            zsh)
              unset PSModulePath PSVersionTable
              export SHELL=/bin/zsh
              ;;
            *) echo "unsupported Unix install-proof shell: $PROOF_SHELL" >&2; exit 1 ;;
          esac
          captures="$RUNNER_TEMP/kin-proof-captures"
          mkdir -p "$captures"
          set +e
          kin embed --max-seconds 300 --json \
            > "$captures/kin-embed.json" 2> "$captures/kin-embed-refusal.txt"
          embed_rc=$?
          set -e
          cat "$captures/kin-embed.json" "$captures/kin-embed-refusal.txt"
          if [ "$embed_rc" -eq 0 ]; then
            echo "::error::kin embed ran on an archive with no local embedding model and no provider selected"
            exit 1
          fi
          embed_refusal="$(cat "$captures/kin-embed-refusal.txt")"
          case "$embed_refusal" in
            *"kin embed cannot index anything here"*"no local embedding model"*) ;;
            *)
              echo "::error::kin embed exited $embed_rc without the refusal that names the missing model and provider"
              exit 1
              ;;
          esac

          PROOF_CAPTURES="$captures" node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");

          const captures = process.env.PROOF_CAPTURES;
          const budgetMs = 180_000;
          const pollSeconds = 1;
          const log = [];
          const record = (line) => {
            log.push(line);
            console.log(line);
          };
          const flush = () => {
            fs.writeFileSync(
              path.join(captures, "kin-embedding-settle.txt"),
              `${log.join("\n")}\n`,
            );
          };

          const fingerprint = (status) => {
            const enrichment = status.semantic_enrichment ?? {};
            const coverage = status.embedding_coverage ?? {};
            return JSON.stringify({
              repository_generation: status.repository?.generation,
              workspace_generation: status.workspace?.generation,
              authority_generation: enrichment.authority_generation,
              enrichment_workspace_generation: enrichment.workspace_generation,
              entity_count: enrichment.entity_count,
              relation_count: enrichment.relation_count,
              semantic_change_count: enrichment.semantic_change_count,
              coverage_state: coverage.state,
              coverage_reason: coverage.reason,
              indexed: coverage.indexed,
              pending: coverage.pending,
              total: coverage.total,
            });
          };

          const deadline = Date.now() + budgetMs;
          let previous = null;
          let last = "no status read completed";
          let reads = 0;
          let settled = false;
          while (Date.now() < deadline) {
            reads += 1;
            let status;
            try {
              status = JSON.parse(
                execFileSync("kin", ["status", "--json"], { encoding: "utf8", timeout: 120_000 }),
              );
            } catch (error) {
              last = `kin status --json failed: ${error.message}`;
              previous = null;
              execFileSync("sleep", [String(pollSeconds)]);
              continue;
            }
            const current = fingerprint(status);
            last = current;
            if (current === previous) {
              record(`settled after ${reads} reads: ${current}`);
              settled = true;
              break;
            }
            previous = current;
            execFileSync("sleep", [String(pollSeconds)]);
          }
          if (!settled) {
            record(`did not settle within ${budgetMs / 1000}s over ${reads} reads: ${last}`);
            flush();
            console.log(
              `::error::the store never settled: ${last}. ` +
              "Two consecutive reads must agree that nothing new was admitted between them.",
            );
            process.exit(1);
          }
          flush();
          NODE

          settle_probe="$(kin status --help 2>&1 || true)"
          case "$settle_probe" in
            *--wait-quiesce*)
              printf 'bounded settle (kin status --wait-quiesce 60)\n' \
                | tee "$captures/kin-status-settle-mode.txt"
              set +e
              kin status --json --wait-quiesce 60 | tee "$captures/kin-embedded-status.json"
              settle_rc=$?
              set -e
              ;;
            *)
              printf 'single sample (installed kin has no --wait-quiesce)\n' \
                | tee "$captures/kin-status-settle-mode.txt" >&2
              set +e
              kin status --json | tee "$captures/kin-embedded-status.json"
              settle_rc=$?
              set -e
              ;;
          esac
          if [ "$settle_rc" -ne 0 ] && [ "$settle_rc" -ne 9 ]; then exit "$settle_rc"; fi
          kin setup status --json | tee "$captures/kin-embedded-health.json"
          kin doctor --json | tee "$captures/kin-embedded-doctor.json"
          kin search hello --semantic --json | tee "$captures/kin-semantic-search.json"
          kin locate hello --json --explain --max-files 5 | tee "$captures/kin-semantic-locate.json"

      - name: Restore captured proof reports into the proof repository
        if: inputs.proof_mode == 'candidate-full' && (always())
        shell: bash
        run: |
          set -euo pipefail
          captures="$RUNNER_TEMP/kin-proof-captures"
          destination="$PWD/kin-install-proof"
          if [ ! -d "$captures" ]; then
            echo "no proof captures were taken"
            exit 0
          fi
          if [ ! -d "$destination" ]; then
            echo "no proof repository exists to restore captures into"
            exit 0
          fi
          restored=0
          while IFS= read -r capture; do
            [ -n "$capture" ] || continue
            cp "$captures/$capture" "$destination/$capture"
            restored=$((restored + 1))
          done < <(ls -1 "$captures")
          echo "restored $restored proof capture(s) into the proof repository"

      - name: Validate installed capability proof
        if: inputs.proof_mode == 'candidate-full'
        shell: bash
        working-directory: kin-install-proof
        env:
          LOCAL_ARTIFACT: ${{ inputs.local_artifact || '' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const runnerOs = process.env.RUNNER_OS;
          const isWindows = runnerOs === "Windows";
          const expectedCommit = fs.readFileSync("../expected-commit.txt", "utf8").trim();
          const expectedLock = fs.readFileSync("../expected-lock-sha.txt", "utf8").trim();
          const installedKin = fs.readFileSync("../installed-kin-command.txt", "utf8").trim();
          const legacyVfs = fs.readFileSync("../legacy-vfs-mode.txt", "utf8").trim() === "true";
          const expectedInstalledKin = path.join(os.homedir(), ".kin", "bin", isWindows ? "kin.exe" : "kin");
          if (installedKin !== expectedInstalledKin) {
            throw new Error(`installed Kin command proof ${installedKin || "missing"} does not equal ${expectedInstalledKin}`);
          }
          const status = JSON.parse(fs.readFileSync("kin-status.json", "utf8"));
          const cliMeta = JSON.parse(fs.readFileSync("kin-build-meta.json", "utf8"));
          const daemonHealth = JSON.parse(fs.readFileSync("kin-daemon-health.json", "utf8"));
          const fullSha = /^[0-9a-f]{40}$/;
          const lockSha = /^[0-9a-f]{64}$/;
          if (cliMeta.schema !== "kin.bench-meta.v2") {
            throw new Error(`kin-build-meta.json: unsupported schema ${cliMeta.schema ?? "missing"}`);
          }
          const builds = new Map([
            ["cli", {
              sha: cliMeta.kin_commit,
              dirty: cliMeta.kin_dirty,
              sourceKnown: cliMeta.kin_source_known,
              dependencyProvenance: cliMeta.dependency_provenance,
            }],
            ["daemon", {
              sha: daemonHealth.build?.sha,
              dirty: daemonHealth.build?.dirty,
              sourceKnown: daemonHealth.build?.source_known,
              dependencyProvenance: daemonHealth.build?.dependency_provenance,
            }],
          ]);
          for (const [side, build] of builds) {
            if (!fullSha.test(build.sha ?? "")) {
              throw new Error(`${side} build SHA is not a full 40-hex commit: ${build.sha ?? "missing"}`);
            }
            if (build.sha !== expectedCommit) {
              throw new Error(`${side} build SHA ${build.sha} does not match release tag ${expectedCommit}`);
            }
            if (build.dirty !== false) {
              throw new Error(`${side} release binary is dirty or did not report a clean build`);
            }
            if (build.sourceKnown !== true) {
              throw new Error(`${side} release binary did not prove source_known=true`);
            }
            if (!lockSha.test(build.dependencyProvenance ?? "")) {
              throw new Error(`${side} Cargo.lock provenance is missing or malformed`);
            }
            if (build.dependencyProvenance !== expectedLock) {
              throw new Error(`${side} Cargo.lock provenance ${build.dependencyProvenance} does not match release source ${expectedLock}`);
            }
          }
          if (builds.get("cli").dependencyProvenance !== builds.get("daemon").dependencyProvenance) {
            throw new Error("CLI and daemon were built from different Cargo.lock provenance");
          }

          if (status.schema !== "kin.status.v3") {
            throw new Error(`kin-status.json: unsupported schema ${status.schema ?? "missing"}`);
          }
          const validateEmbeddingCoverage = (coverage, label) => {
            if (!coverage || typeof coverage !== "object" || Array.isArray(coverage)) {
              throw new Error(`${label}: embedding_coverage is missing or malformed`);
            }
            if (coverage.state === "observed") {
              if (coverage.source !== "live_query_graph") {
                throw new Error(`${label}: observed coverage has source ${coverage.source ?? "missing"}`);
              }
              for (const field of ["indexed", "pending", "total"]) {
                if (!Number.isSafeInteger(coverage[field]) || coverage[field] < 0) {
                  throw new Error(`${label}: embedding_coverage.${field} is not a non-negative integer`);
                }
              }
              if (coverage.reason !== undefined || coverage.indexed > coverage.total || coverage.pending < coverage.total - coverage.indexed) {
                throw new Error(`${label}: observed embedding coverage violates kin.status.v3 invariants`);
              }
            } else if (coverage.state === "unobserved") {
              if (typeof coverage.reason !== "string" || coverage.reason.length === 0) {
                throw new Error(`${label}: unobserved embedding coverage carries no reason`);
              }
              for (const field of ["source", "indexed", "pending", "total"]) {
                if (coverage[field] !== undefined) {
                  throw new Error(`${label}: unobserved embedding coverage carries ${field}`);
                }
              }
            } else {
              throw new Error(`${label}: unknown embedding coverage state ${coverage.state ?? "missing"}`);
            }
          };
          if (cliMeta.embeddings?.vector_enabled !== true || cliMeta.embeddings?.embeddings_enabled !== true ||
              cliMeta.embeddings?.local_inference_enabled !== false ||
              cliMeta.embeddings?.external_embeddings_enabled !== true ||
              cliMeta.embeddings?.metal_enabled !== false || cliMeta.embeddings?.provider !== "none") {
            throw new Error(`${runnerOs} bench metadata does not prove the engine-free default archive profile`);
          }
          if (!isWindows) {
            validateEmbeddingCoverage(status.embedding_coverage, "kin-status.json");
          }
          const reports = ["kin-health.json", "kin-doctor.json"].map((path) => [
            path,
            JSON.parse(fs.readFileSync(path, "utf8")),
          ]);
          const healthNeedsAttention = (check) =>
            check.status !== "healthy" && check.status !== "unsupported";
          const healthBlocksReadiness = (check) =>
            check.status === "missing" ||
            check.status === "misconfigured" ||
            (check.id === "semantic_query_readiness" && check.status === "stale");
          const healthJoin = (checks) => {
            if (checks.some(healthBlocksReadiness)) return "failing";
            return checks.some(healthNeedsAttention) ? "needs_attention" : "ready";
          };
          const attentionRows = (report) => (report.checks ?? [])
            .filter(healthNeedsAttention)
            .map((check) => `${check.id}=${check.status}`)
            .join(", ") || "none";
          const validateHealthReport = (report, reportPath) => {
            if (!Array.isArray(report.checks)) {
              throw new Error(`${reportPath}: checks is missing or malformed`);
            }
            const checks = new Map(report.checks.map((check) => [check.id, check]));
            if (checks.size !== report.checks.length) {
              throw new Error(`${reportPath}: duplicate health-check ids are not authoritative`);
            }
            if (report.verdict === undefined) {
              throw new Error(
                `${reportPath}: the report carries no verdict field, so these bytes predate the health-join update and their aggregate cannot be graded against the health join`
              );
            }
            const verdict = healthJoin(report.checks);
            if (report.verdict !== verdict) {
              throw new Error(`${reportPath}: verdict=${report.verdict} disagrees with checks; expected ${verdict}`);
            }
            if (report.healthy !== (verdict === "ready")) {
              throw new Error(
                `${reportPath}: aggregate healthy=${report.healthy} disagrees with checks; expected ${verdict === "ready"}`
              );
            }
            return checks;
          };
          for (const fallbackReportPath of [
            "kin-claude-fallback-health.json",
            "kin-claude-fallback-doctor.json",
          ]) {
            const fallbackReport = JSON.parse(fs.readFileSync(fallbackReportPath, "utf8"));
            const fallbackChecks = validateHealthReport(fallbackReport, fallbackReportPath);
            if (fallbackChecks.get("mcp_client_claude")?.status !== "healthy") {
              throw new Error(`${fallbackReportPath}: forced Claude fallback config is not healthy`);
            }
            for (const absentId of [
              "mcp_client_cursor",
              "mcp_client_codex",
              "mcp_client_gemini",
              "mcp_client_windsurf",
              "mcp_client_antigravity",
            ]) {
              if (fallbackChecks.has(absentId)) {
                throw new Error(`${fallbackReportPath}: isolated fallback HOME unexpectedly exposed ${absentId}`);
              }
            }
          }
          const required = new Map([
            ["kin_binary", "healthy"],
            ["kin_daemon_binary", "healthy"],
            ["daemon_running", "healthy"],
            ["repo_init", "healthy"],
            ["shell_path", "healthy"],
            ["setup_ledger", "healthy"],
            ["registry_authority", isWindows ? "unsupported" : "healthy"],
            ["vfs_projection", isWindows || !legacyVfs ? "unsupported" : "healthy"],
            ["mcp_client_claude", "healthy"],
            ["mcp_client_cursor", "healthy"],
            ["mcp_client_codex", "healthy"],
            ["mcp_client_gemini", "healthy"],
            ["mcp_client_windsurf", "healthy"],
            ["mcp_client_antigravity", "healthy"],
            ["mcp_client_antigravity_workspace", "healthy"],
          ]);

          for (const [path, report] of reports) {
            const checks = validateHealthReport(report, path);
            const firstRunAttention = new Map([
              ["projection_mode", ["stale"]],
              ["reference_edge_coverage", ["pending"]],
              ["memory_floor", ["degraded"]],
              ["relation_census", ["pending"]],
            ]);
            const untolerated = report.checks.filter(
              (check) =>
                healthNeedsAttention(check) &&
                !(firstRunAttention.get(check.id) ?? []).includes(check.status)
            );
            if (untolerated.length > 0) {
              throw new Error(
                `${path}: rows needing attention that a fresh install does not expect: ` +
                `${untolerated.map((check) => `${check.id}=${check.status}`).join(", ")}; ` +
                `verdict=${report.verdict}; every row needing attention: ${attentionRows(report)}`
              );
            }
            for (const [id, expected] of required) {
              const actual = checks.get(id)?.status;
              if (actual !== expected) {
                throw new Error(`${path}: ${id} is ${actual ?? "missing"}, expected ${expected}`);
              }
            }
            const semanticReadiness = checks.get("semantic_query_readiness")?.status;
            const allowedSemanticReadiness = ["unsupported"];
            if (!allowedSemanticReadiness.includes(semanticReadiness)) {
              throw new Error(
                `${path}: semantic_query_readiness is ${semanticReadiness ?? "missing"}, expected ${allowedSemanticReadiness.join(" or ")}`
              );
            }
            const hardFailures = report.checks.filter((check) =>
              check.status === "missing" || check.status === "misconfigured"
            );
            if (hardFailures.length > 0) {
              throw new Error(`${path}: hard failures: ${hardFailures.map((c) => c.id).join(", ")}`);
            }
          }

          const search = JSON.parse(fs.readFileSync("kin-search.json", "utf8"));
          if (!Array.isArray(search) || !search.some((record) => record.name === "hello" && record.file === "probe.py")) {
            throw new Error("lexical kin search did not return the seeded hello entity");
          }
          const locate = JSON.parse(fs.readFileSync("kin-locate.json", "utf8"));
          if (!locate.files?.some((entry) => entry.path === "probe.py")) {
            throw new Error("kin locate did not return the seeded probe.py graph artifact");
          }

          const home = os.homedir();
          const repoRoot = fs.realpathSync(process.cwd());
          const ordinaryArgs = ["mcp", "start"];
          const repositoryArgs = ["mcp", "start", "--repo", repoRoot];
          const mcpConfigs = [
            { path: path.join(home, ".claude.json"), args: ordinaryArgs, profile: "agent-default" },
            { path: path.join(home, ".cursor", "mcp.json"), args: ordinaryArgs, profile: "agent-routed" },
            { path: path.join(home, ".gemini", "settings.json"), args: ordinaryArgs, profile: "agent-routed" },
            { path: path.join(home, ".codeium", "windsurf", "mcp_config.json"), args: ordinaryArgs, profile: "agent-routed" },
            { path: "kin-claude-fallback-config.json", args: ordinaryArgs, profile: "agent-default" },
            { path: "kin-codex-config.json", args: repositoryArgs, profile: "agent-routed" },
            { path: path.join(home, ".gemini", "config", "mcp_config.json"), args: repositoryArgs, cwd: repoRoot, profile: "agent-routed" },
            { path: path.join(home, ".gemini", "antigravity-ide", "mcp_config.json"), args: repositoryArgs, cwd: repoRoot, profile: "agent-routed" },
            { path: path.join(repoRoot, ".agents", "mcp_config.json"), args: repositoryArgs, cwd: repoRoot, profile: "agent-routed" },
          ];
          const stripVerbatim = (p) => (typeof p === "string" && p.startsWith("\\\\?\\") ? p.slice(4) : p);
          for (const expected of mcpConfigs) {
            const entry = JSON.parse(fs.readFileSync(expected.path, "utf8"))?.mcpServers?.kin;
            const entryArgs = Array.isArray(entry?.args) ? entry.args.map(stripVerbatim) : entry?.args;
            if (
              !entry ||
              entry.command !== installedKin ||
              JSON.stringify(entryArgs) !== JSON.stringify(expected.args) ||
              entry.env?.KIN_MCP_TOOL_PROFILE !== expected.profile ||
              (expected.cwd !== undefined && stripVerbatim(entry.cwd) !== expected.cwd)
            ) {
              throw new Error(`${expected.path}: Kin MCP entry is missing or malformed`);
            }
          }
          const legacy = JSON.parse(
            fs.readFileSync(path.join(home, ".gemini", "antigravity-ide", "mcp_config.json"), "utf8")
          );
          if (legacy.userPolicy !== "preserve" || legacy.mcpServers.kin.env.USER_POLICY !== "preserve") {
            throw new Error("Antigravity legacy repair did not preserve unrelated user policy");
          }
          if (!isWindows) {
            const embedRefusal = fs.readFileSync("kin-embed-refusal.txt", "utf8");
            if (
              !embedRefusal.includes("kin embed cannot index anything here") ||
              !embedRefusal.includes("no local embedding model")
            ) {
              throw new Error(
                `kin embed did not refuse with the reason an engine-free archive has: ${embedRefusal.trim() || "no output"}`
              );
            }
            const embeddedStatus = JSON.parse(fs.readFileSync("kin-embedded-status.json", "utf8"));
            if (embeddedStatus.schema !== "kin.status.v3") {
              throw new Error(`kin-embedded-status.json: unsupported schema ${embeddedStatus.schema ?? "missing"}`);
            }
            validateEmbeddingCoverage(embeddedStatus.embedding_coverage, "kin-embedded-status.json");
            const embeddedCoverage = embeddedStatus.embedding_coverage;
            if (embeddedCoverage.state === "observed" && embeddedCoverage.indexed !== 0) {
              throw new Error(
                `an archive that cannot embed reports indexed embeddings: ${JSON.stringify(embeddedCoverage)}`
              );
            }
            for (const reportPath of ["kin-embedded-health.json", "kin-embedded-doctor.json"]) {
              const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
              const checks = validateHealthReport(report, reportPath);
              const readiness = checks.get("semantic_query_readiness")?.status;
              if (readiness !== "unsupported") {
                throw new Error(
                  `${reportPath}: semantic_query_readiness=${readiness ?? "missing"} after a ` +
                  `refused embed on an archive that cannot embed; verdict=${report.verdict}; ` +
                  `every row needing attention: ${attentionRows(report)}`
                );
              }
              const postEmbedAttention = new Map([
                ["projection_mode", ["stale"]],
                ["reference_edge_coverage", ["pending"]],
                ["memory_floor", ["degraded"]],
                ["relation_census", ["pending"]],
              ]);
              const stillWaiting = report.checks.filter(
                (check) =>
                  healthNeedsAttention(check) &&
                  !(postEmbedAttention.get(check.id) ?? []).includes(check.status)
              );
              if (stillWaiting.length > 0) {
                throw new Error(
                  `${reportPath}: rows needing attention after the refused embed that this ` +
                  `runner does not expect: ` +
                  `${stillWaiting.map((check) => `${check.id}=${check.status}`).join(", ")}; ` +
                  `verdict=${report.verdict}`
                );
              }
            }
            const semanticSearch = JSON.parse(fs.readFileSync("kin-semantic-search.json", "utf8"));
            if (!Array.isArray(semanticSearch) || !semanticSearch.some((record) => record.name === "hello" && record.file === "probe.py")) {
              throw new Error("kin search --semantic did not answer the seeded hello entity from the graph");
            }
            const semanticLocate = JSON.parse(fs.readFileSync("kin-semantic-locate.json", "utf8"));
            if (semanticLocate.semantic_coverage?.embedding_state !== "not_used" || !semanticLocate.files?.some((entry) => entry.path === "probe.py")) {
              throw new Error("kin locate did not answer probe.py from the graph with embeddings reported unused");
            }
          }
          NODE

      - name: Preserve proof reports
        if: inputs.proof_mode == 'candidate-full' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-proof-${{ matrix.os }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            kin-version.txt
            kin-daemon-version.txt
            expected-version.txt
            expected-commit.txt
            expected-lock-sha.txt
            installed-kin-command.txt
            attestation-verification.json
            release-provenance.json
            release-provenance.json.sha256
            release-provenance-attestation.json
            installed-vfs-provenance.json
            latest-release-url.txt
            kin-windows-bench-meta.json
            kin-windows-registry-authority.json
            kin-windows-registry-fix.txt
            kin-windows-setup.txt
            kin-windows-health.json
            kin-windows-doctor.json
            kin-windows-admission/*.txt
            kin-install-proof/*.txt
            kin-install-proof/*-config.json
            kin-install-proof/.agents/mcp_config.json
            kin-install-proof/*.json
            kin-install-proof/*.log

      - name: Record the real Windows rehearsal
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          SOURCE_PATH: ${{ inputs.source_path }}
          BASELINE_TAG: ${{ inputs.release_tag }}
          PROOF_MODE: ${{ inputs.proof_mode }}
        run: |
          set -euo pipefail
          python "rehearsal-source/$SOURCE_PATH/scripts/release-rehearsal.py" record \
            --source "rehearsal-source/$SOURCE_PATH" --candidate "$CANDIDATE" \
            --release-tag "$BASELINE_TAG" --mode "$PROOF_MODE" --leg windows \
            --output "$RUNNER_TEMP/rehearsal/windows.json"
      - name: Upload the Windows rehearsal receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-rehearsal-windows
          path: ${{ runner.temp }}/rehearsal/windows.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve baseline compatibility captures
        if: always() && inputs.proof_mode == 'compatibility-baseline'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-rehearsal-compatibility-captures
          path: |
            ${{ runner.temp }}/rehearsal/compatibility
            ${{ runner.temp }}/rehearsal/mirror-boundary
          if-no-files-found: warn
          retention-days: 30
