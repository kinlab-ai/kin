  feature-tests:
    name: Feature permutation tests
    needs: [changes, feature-tests-ubuntu-shards]
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Require every feature group to have succeeded
        env:
          SHARDS: ${{ needs.feature-tests-ubuntu-shards.result }}
        run: |
          set -euo pipefail
          if [ "$SHARDS" != "success" ]; then
            echo "::error title=Feature groups did not pass::the feature permutation groups reported '$SHARDS'"
            exit 1
          fi
          echo "every feature permutation group succeeded"

  feature-tests-macos-aggregate:
    name: Feature permutation tests
    needs: [changes, feature-tests-macos-shards]
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && github.event_name != 'pull_request' }}
