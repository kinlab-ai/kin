[workspace]
resolver = "2"
members = [
    # Third-party parser assets vendored because upstream has no release with
    # the fix. See crates/kin-grammar-typescript/README.md.
    "crates/kin-grammar-typescript",

    # Kin libraries, developed here and published as independent packages.
    "crates/kin-blobs",
    "crates/kin-io",
    "crates/kin-db",
    "crates/kin-infer",
    "crates/kin-lsp",
    "crates/kin-model",
    "crates/kin-search",
    "crates/kin-vector",
    "crates/kin-vfs-core",
    "crates/kin-core",
    "crates/kin-parser",
    "crates/kin-index",
    "crates/kin-projection",
    "crates/kin-reconcile",
    "crates/kin-git",
    "crates/kin-context",
    "crates/kin-semantic-contracts",
    "crates/kin-ranking",
    "crates/kin-remote",
    "crates/kin-review",
    "crates/kin-migrate",
    "crates/kin-runtime",
    "crates/kin-buildinfo",
    "crates/kin-derivation-inputs",
    "crates/kin-notify",
    "crates/kin-notifier-macos",
    "crates/kin-agent",
    "crates/kin-cli",
    "crates/kin-daemon-spawn",
    "crates/kin-daemon",
    "crates/kin-mcp",
    "crates/kin-spine",
    "crates/kin-registry",
    "tests/integration",
]

[workspace.package]
version = "0.8.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Troy Fortin <troy@firelock.ai>"]
repository = "https://github.com/firelock-ai/kin"

[workspace.dependencies]
parking_lot = "0.12"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
semver = "1"
# Line differ for `kin diff`'s content surface. Renders two graph-owned CAS
# bodies; it is a rendering dependency and never a source of truth.
similar = "3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Hashing & signatures
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["std"] }

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
filetime = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# File watching
notify = "8"

# Tree-sitter
tree-sitter = "0.26"
# The TypeScript and TSX grammars, vendored rather than pinned: 0.23.2 is
# upstream's newest release and it cannot read two constructs `tsc` accepts.
kin-grammar-typescript = { path = "crates/kin-grammar-typescript" }
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-hcl = "1.1"

# Git interop
gix = { version = "0.84", default-features = false, features = ["max-performance-safe", "sha1"] }
gix-ignore = "0.21"
bstr = "1"

# HTTP / MCP
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
socket2 = "0.6"

# Interactive CLI
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.16"

# Archive generation
tar = "0.4"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

# Parallelism
rayon = "1"

# File locking
fs2 = "0.4"
rustix = { version = "1", features = ["fs"] }

# Testing
tempfile = "3"
pretty_assertions = "1"
serial_test = "4"

# Internal crates
kin-model = { path = "crates/kin-model", version = "=0.7.28", registry = "kin" }
kin-blobs = { path = "crates/kin-blobs", version = "=0.1.5", registry = "kin" }
kin-core = { path = "crates/kin-core" }
kin-io = { path = "crates/kin-io" }
kin-parser = { path = "crates/kin-parser" }
kin-index = { path = "crates/kin-index" }
kin-projection = { path = "crates/kin-projection" }
kin-reconcile = { path = "crates/kin-reconcile" }
kin-git = { path = "crates/kin-git" }
kin-context = { path = "crates/kin-context" }
kin-semantic-contracts = { path = "crates/kin-semantic-contracts" }
kin-ranking = { path = "crates/kin-ranking" }
kin-remote = { path = "crates/kin-remote" }
kin-review = { path = "crates/kin-review" }
kin-migrate = { path = "crates/kin-migrate" }
kin-runtime = { path = "crates/kin-runtime" }
kin-buildinfo = { path = "crates/kin-buildinfo" }
kin-derivation-inputs = { path = "crates/kin-derivation-inputs" }
kin-notify = { path = "crates/kin-notify" }
kin-agent = { path = "crates/kin-agent" }
kin-cli = { path = "crates/kin-cli", default-features = false }
kin-daemon = { path = "crates/kin-daemon" }
kin-daemon-spawn = { path = "crates/kin-daemon-spawn" }
kin-mcp = { path = "crates/kin-mcp" }
kin-spine = { path = "crates/kin-spine" }
kin-registry = { path = "crates/kin-registry" }
kin-lsp = { path = "crates/kin-lsp", version = "=0.7.19", registry = "kin" }
# `default-features = false` matters: kin-infer's default is its `engine` feature,
# the inference engine and its dependencies. kin-cli and kin-daemon read only its
# resource plan, and the engine arrives only through `kin-db/embeddings`, so a
# build without embeddings compiles none of it.
kin-infer = { path = "crates/kin-infer", version = "=0.2.44", registry = "kin", default-features = false }
# No "metal" here, and no embeddings either: each member asks for what it uses.
# Metal is the `metal` feature of kin-cli and kin-daemon, which asks for
# `kin-db/metal` on every target. That is safe because every metal and accelerate
# site in kin-infer is gated `all(feature = ..., target_os = "macos")`, including the
# `pub mod metal_backend;` declaration, and the metal, objc2 and block crates are
# declared only under `[target.'cfg(target_os = "macos")'.dependencies]`, so off
# macOS the feature turns on nothing rather than failing to build. It used to be an
# unconditional macOS dependency block in kin-cli and kin-daemon, which put the whole
# embedding stack into every macOS build, including one without default features.
kin-db = { path = "crates/kin-db", version = "=0.7.114", registry = "kin", default-features = false }
# Pinned to the exact version kin-db builds its name-token index with. A
# per-token name query hits that index only when the token came out of the same
# tokenizer, so a version skew here would be a silent recall loss rather than a
# build failure.
kin-search = { path = "crates/kin-search", version = "=0.1.9", registry = "kin" }
kin-vfs-core = { path = "crates/kin-vfs-core", version = "=0.4.25", registry = "kin" }
# Reached transitively through kin-db and kin-model rather than by any crate
# here naming it. It still needs an entry, because a workspace member can only
# say `{ workspace = true }` for a name this table carries.
kin-vector = { path = "crates/kin-vector", version = "=0.2.1", registry = "kin" }

# Every daemon start on Linux records its owner by hashing its own executing
# image, and a stop hashes it again before it signals. Unoptimized, sha2 hashes
# about twelve times slower (43 against 508 MiB/s measured), which on a debug
# daemon image of hundreds of megabytes put tens of seconds on every test
# daemon's start and pushed the test shards past their budget. Only this one
# hashing crate is compiled optimized in dev and test builds; release is
# unchanged.
[profile.dev.package.sha2]
opt-level = 3

# A persistent local edit/test profile. Optimize dependencies once, while
# keeping workspace code cheap to rebuild and retaining incremental state.
[profile.iteration]
inherits = "dev"
opt-level = 0
debug = 0
incremental = true
lto = "off"
codegen-units = 256

[profile.iteration.package."*"]
opt-level = 3
debug = 0

# An explicit local full-suite profile retains dev assertions and overflow
# checks while optimizing workspace code for warm test execution.
[profile.suite]
inherits = "iteration"
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
