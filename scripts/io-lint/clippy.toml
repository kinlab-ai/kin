# The filesystem boundary lint's configuration. scripts/check-io-lint.py runs
# clippy with CLIPPY_CONF_DIR pointing here, so this file replaces the
# workspace clippy.toml for that run only. Every raw entry point to the
# filesystem or to process creation is listed, and clippy resolves each call
# to the function it names, so an alias, a glob import, a PathBuf method, a
# function pointer or a macro expansion is reported like a direct call.
# Every reported site must appear in allowed-sites.txt beside this file.
#
# `allow-invalid` marks paths into crates or platforms a given crate may not
# reach, so a crate that does not depend on them is not warned about them.
# The std entries carry no such mark: a typo there is reported.

