# Kin Cargo registry for public and local builds.
#
# Keep this file free of local path patches and credentials so a fresh public
# clone can resolve Kin crates from public source. Put machine-local overrides
# in Cargo's user-level config instead of this tracked file.

[registries.kin]
index = "sparse+https://kinlab.ai/registry/cargo/"


# Nothing cargo runs fetches a language server's analysis environment: not a
# test, not a daemon a test starts, not CI. Kin's own default is on, so a
# developer who wants `cargo run` to fetch sets KIN_ANALYSIS_ENVIRONMENTS=1,
# which wins over this value. The test `the_test_harness_never_fetches` in
# kin-lsp fails if this is removed.
[env]
KIN_ANALYSIS_ENVIRONMENTS = "0"

# Plain `cargo test` gives every test binary the same environment nextest's
# setup script gives every test process: a fresh temporary directory for the
# run, a private Kin registry and relaxed drive flushes. The runner starts any
# other executable, `cargo run` included, unchanged. See
# scripts/test-env/cargo-runner.sh.
[target.'cfg(unix)']
runner = "scripts/test-env/cargo-runner.sh"
