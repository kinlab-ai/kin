[package]
name = "kin-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Background daemon service for Kin"
repository.workspace = true

[lib]
doctest = false

[features]
# The same product default as kin-cli: no embedding model. See kin-cli's manifest.
default = ["vector", "external-embeddings"]
vector = ["kin-db/vector", "kin-cli/vector"]
external-embeddings = ["kin-db/external-embeddings", "kin-cli/external-embeddings"]
embeddings = ["kin-db/embeddings", "kin-cli/embeddings"]
decision = ["kin-cli/decision"]
# Embeddings on Apple's GPU; `embeddings` and nothing more off macOS.
metal = ["embeddings", "kin-cli/metal"]
# `object_store` is kin-db's own GCS client crate, pulled in here at the same
# version so `GcsBackend::from_store` accepts a store this crate built. That is
# what lets a custom endpoint (see `gcs_endpoint`) redirect the backend at an
# emulator without a kin-db change.
gcs = ["kin-db/gcs", "dep:object_store", "object_store/gcp"]
firestore = ["kin-spine/firestore"]

[dependencies]
mimalloc = { version = "0.1", default-features = false }
kin-model = { workspace = true }
kin-core = { workspace = true }
kin-daemon-spawn = { workspace = true }
kin-db = { workspace = true }
# The resource plan only. The engine arrives through `kin-db/embeddings`.
kin-infer = { workspace = true }
kin-blobs = { workspace = true }
kin-io = { workspace = true }
kin-index = { workspace = true }
kin-projection = { workspace = true }
kin-parser = { workspace = true }
kin-reconcile = { workspace = true }
kin-spine = { workspace = true }
kin-registry = { workspace = true }
kin-lsp = { workspace = true }
# The patched TypeScript grammar the daemon hands every language server it
# starts, for kin-lsp's binding-initializer proof.
kin-grammar-typescript = { workspace = true }
kin-cli = { workspace = true }
kin-buildinfo = { workspace = true }
kin-mcp = { workspace = true }
kin-review = { workspace = true }
kin-remote = { workspace = true, features = ["http"] }
axum = { workspace = true }
http-body = "1"
futures-util = "0.3"
rayon = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
socket2 = { workspace = true }
async-stream = "0.3"
base64 = "0.23"
tar = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
which = "8"
object_store = { version = "0.14", optional = true }
fs2 = { workspace = true }
sysinfo = "0.39"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Chains a shutdown handler alongside tokio's own SIGTERM/SIGINT registration
# (tokio registers through this same crate) so arming the force-exit backstop
# never depends on the async runtime being schedulable.
signal-hook-registry = "1.4"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
kin-mcp = { workspace = true, features = ["test-support"] }
# A shorter termination grace, so the language-server group tests prove the
# escalation to SIGKILL without waiting out the production two seconds.
kin-lsp = { workspace = true, features = ["test-support"] }
async-trait = "0.1"
kin-core = { workspace = true, features = ["test-support"] }
kin-git = { workspace = true, features = ["test-support"] }
# A watcher backend that delivers nothing, so the loop's behaviour when the host
# drops every filesystem event is graded deterministically.
kin-index = { workspace = true, features = ["test-support"] }
kin-migrate = { workspace = true }
# The durable spine fake, so the composed rollout path can be driven against the
# real FirestoreSpineBackend over a fake transport rather than a second
# implementation of the CAS semantics.
kin-spine = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
toml = { workspace = true }
# `full` does not carry `test-util`, so paused time for a deadline test needs it
# named here: a sibling's dev dependency unifies it only into that sibling's
# own test build.
tokio = { workspace = true, features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
