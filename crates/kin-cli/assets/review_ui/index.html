<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Kin review</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to review</a>
  <div class="app" id="app">
    <aside class="rail" id="rail" aria-label="Review">
      <header class="rail-head">
        <a class="brand" id="brand" aria-label="Kin">
          <img src="/mark.svg" alt="" width="20" height="20" />
          <span class="brand-name">KIN</span>
        </a>
        <button class="icon-button rail-toggle" id="rail-toggle" type="button" aria-expanded="false" aria-controls="rail-body" aria-label="Browse changes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </header>
      <div class="rail-body" id="rail-body">
        <button class="search-open" id="palette-open" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/></svg>
          <span>Search changes and steps</span><kbd>/</kbd>
        </button>
        <div class="rail-nav">
          <a class="rail-back" id="rail-back" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            <span id="rail-back-label">Back to work</span>
          </a>
          <p class="outline-head rail-label">Changes</p>
          <div class="rail-repo">
            <span class="repo-dot" id="repo-dot" aria-hidden="true"></span>
            <span class="rail-repo-name" id="repo"></span>
            <span class="rail-host" id="review-host"></span>
            <span class="rail-branch" id="review-branch" title="The branch you are on">Loading branch…</span>
          </div>
          <div class="filters segmented" id="filters" role="group" aria-label="Show changes by review"></div>
        </div>
        <div class="rail-scroll">
          <nav class="changes" id="changes" aria-label="Changes, newest first"></nav>
        </div>
      </div>
      <footer class="rail-foot">
        <div class="rail-foot-row">
          <span class="rail-live" id="live" title="The list follows the repository"></span>
          <button class="link-button" id="help-open" type="button">Shortcuts <kbd>?</kbd></button>
        </div>
        <div class="rail-foot-row">
          <button class="link-button" id="editor" type="button"></button>
        </div>
        <div class="rail-foot-row">
          <span id="rail-version">Kin</span>
          <button class="rail-theme" id="theme" type="button" aria-label="Change colour theme">Auto</button>
        </div>
      </footer>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <p class="loading">Loading the change.</p>
    </main>

    <aside class="outline" id="outline" aria-label="Steps in this change"></aside>
  </div>

  <div class="overlay" id="palette" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Search changes and steps">
      <input class="palette-input" id="palette-input" name="search" type="text" autocomplete="off" spellcheck="false" placeholder="Jump to a step, a change or an action" aria-label="Search" />
      <ul class="palette-list" id="palette-list" role="listbox" aria-label="Results"></ul>
      <p class="palette-hint"><kbd>↑</kbd><kbd>↓</kbd> to move <kbd>Enter</kbd> to open <kbd>Esc</kbd> to close</p>
    </div>
  </div>

  <div class="overlay" id="help" hidden>
    <div class="help" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title">Keyboard shortcuts</h2>
      <dl class="keys-list" id="keys-list"></dl>
      <button class="button" id="help-close" type="button">Close</button>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript>This page needs JavaScript. The same walkthrough prints in a terminal with kin review guide.</noscript>
  <script src="/highlight.js"></script>
  <script src="/diff.js"></script>
  <script src="/map.js"></script>
  <script src="/app.js"></script>
</body>
</html>
