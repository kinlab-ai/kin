[package]
name = "kin-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for Kin semantic VCS"
repository.workspace = true

[features]
# The default build carries no embedding model. Description queries rank on
# entity cards, and it links none of the local inference engine. An external
# provider makes model requests only when explicitly configured.
default = ["vector", "external-embeddings"]
vector = ["kin-db/vector"]
external-embeddings = ["kin-db/external-embeddings"]
# Local embedding and semantic vector search: the inference engine, the model
# loader and the one path that can download a model, which runs only after
# someone asks for it (`kin embed`, or `kin setup` answering yes).
embeddings = ["kin-db/embeddings"]
decision = ["kin-infer/decision"]
# Embeddings on Apple's GPU, with Accelerate on the CPU path. Every Metal and
# Accelerate site in kin-infer is gated on `target_os = "macos"` as well, so on
# any other platform this is `embeddings` and nothing more.
metal = ["embeddings", "kin-db/metal", "kin-db/accelerate"]

[[bin]]
name = "kin"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
kin-model = { workspace = true }
kin-core = { workspace = true }
kin-daemon-spawn = { workspace = true }
kin-blobs = { workspace = true }
kin-parser = { workspace = true }
kin-io = { workspace = true }
kin-index = { workspace = true }
kin-projection = { workspace = true }
kin-reconcile = { workspace = true }
kin-git = { workspace = true }
kin-context = { workspace = true }
kin-semantic-contracts = { workspace = true }
kin-notify = { workspace = true }
kin-review = { workspace = true }
kin-migrate = { workspace = true }
kin-runtime = { workspace = true }
kin-buildinfo = { workspace = true }
kin-mcp = { workspace = true }
kin-db = { workspace = true }
kin-search = { workspace = true }
similar = { workspace = true }
# The resource plan only. The engine arrives through `kin-db/embeddings`.
kin-infer = { workspace = true }
kin-ranking = { workspace = true }
kin-lsp = { workspace = true }
kin-remote = { workspace = true, features = ["http"] }
kin-vfs-core = { workspace = true }
axum = { workspace = true }
futures-util = "0.3"
clap = { workspace = true }
clap_complete = "4"
open = "5"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
age = "0.11"
base64 = "0.23"
directories = "5"
keyring = { version = "3", features = ["apple-native"] }
rpassword = "7"
serde = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
chrono = { workspace = true }
filetime = { workspace = true }
kin-agent = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
hex = { workspace = true }
sha2.workspace = true
ed25519-dalek = { workspace = true }
url = "2"
which = "8"
dialoguer = { workspace = true }
console = { workspace = true }
flate2 = "1"
fs2 = { workspace = true }
regex = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
rayon = { workspace = true }
rustc-hash = "2.1"
sysinfo = "0.39"
toml = { workspace = true }
toml_edit = "0.25"
tempfile = { workspace = true }
unicode-normalization = "0.1"
unicode-ident = "1"
kin-spine = { version = "0.8.6", path = "../kin-spine" }

[dev-dependencies]
kin-mcp = { workspace = true, features = ["test-support"] }
kin-core = { workspace = true, features = ["test-support"] }
kin-git = { workspace = true, features = ["test-support"] }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
# `full` does not carry `test-util`, so `#[tokio::test(start_paused = true)]`
# needs it named here. A workspace build unified it in from a sibling's dev
# dependencies and hid the gap; `cargo test -p kin-cli` is where it showed.
tokio = { workspace = true, features = ["full", "test-util"] }

[target.'cfg(any(unix, windows))'.dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
