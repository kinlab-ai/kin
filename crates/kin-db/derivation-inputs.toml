#
# Which of this crate's sources and dependencies decide what Kin derives and
# stores, read by kin-derivation-inputs. Every file under `roots` is named once.

roots = ["src"]

[[decides]]
products = ["graph"]
files = [
    "src/admission.rs",
    "src/call_site_escape.rs",
    "src/call_site_escape/outside_imports.rs",
    "src/engine/graph.rs",
    "src/engine/index.rs",
    "src/engine/mod.rs",
    "src/error.rs",
    "src/lib.rs",
    "src/storage/format.rs",
    "src/storage/history_replay.rs",
    "src/storage/mod.rs",
    "src/storage/repository.rs",
    "src/store.rs",
    "src/types.rs",
]

[[excluded]]
reason = "tests: each file is compiled only inside a #[cfg(test)] module (mod tests, #[path] or include!)"
files = [
    "src/call_site_escape/tests.rs",
    "src/session_publication_observer_test.rs",
    "src/storage/binding_history_tests.rs",
    "src/storage/call_site_ledgers_format_tests.rs",
    "src/storage/context_validations_format_tests.rs",
    "src/storage/derivation_ledger_tests.rs",
    "src/storage/enrichment_marks_format_tests.rs",
    "src/storage/repository/session_publication_tests.rs",
    "src/storage/repository/test_git_snapshot_proof_integration.rs",
    "src/storage/resolution_records_format_tests.rs",
    "src/storage/snapshot_kvec_root_stamp_test.rs",
]

[[excluded]]
reason = "test support: lib.rs compiles it only under cfg(test) or the test-support feature"
files = [
    "src/session_publication_test_support.rs",
]

[[excluded]]
reason = "not compiled: engine/mod.rs declares no matching module, so nothing reaches this file"
files = [
    "src/engine/matching.rs",
]

[[excluded]]
reason = "graph reads that write nothing: traversals (impact, neighborhoods, dead code) no derivation path calls, enrichment and source-derivation status facts that kin-daemon, kin-mcp and kin-review read, and a tree diff (compute_diff) with no caller"
files = [
    "src/engine/graph/enrichment_status.rs",
    "src/engine/graph/source_derivation.rs",
    "src/engine/incremental.rs",
    "src/engine/traverse.rs",
]

[[excluded]]
reason = "embeddings and vectors: model loading, inference, caching, producer provenance and the HNSW index, separate products; nothing here writes an entity or relation"
files = [
    "src/embed/cache_admin.rs",
    "src/embed/external.rs",
    "src/embed/inference.rs",
    "src/embed/mod.rs",
    "src/embed/model_identity.rs",
    "src/embed/producer.rs",
    "src/embed/rerank.rs",
    "src/embed/serving.rs",
    "src/vector/hnsw.rs",
    "src/vector/mod.rs",
]

[[excluded]]
reason = "text index, retrieval and ranking: the kin-search text index, unified retrieval candidates and the CLI read index only read and rank what is stored"
files = [
    "src/retrieval.rs",
    "src/search/mod.rs",
    "src/search/text.rs",
    "src/storage/index.rs",
]

[[excluded]]
reason = "storage IO and layout: backends, snapshot load and save, the disk-backed change map and its MessagePack body walk, delta journals and snapshot-to-snapshot deltas, memory maps, the SQLite backend and an unused tiered store; they hold and move stored bytes and derive nothing"
files = [
    "src/storage/backend.rs",
    "src/storage/body_walk.rs",
    "src/storage/change_map.rs",
    "src/storage/delta.rs",
    "src/storage/local_journal.rs",
    "src/storage/mmap.rs",
    "src/storage/snapshot.rs",
    "src/storage/sql.rs",
    "src/storage/tiered.rs",
]

[[excluded]]
reason = "repository authority and durability: durable publication and authority frames, crash-safe session publication, integrity and root hashes, change-id validation, the owed-derivation ledger, binding-history qualification and native Git snapshot proofs; they accept, refuse, prove or persist a graph and never change an entity or relation"
files = [
    "src/storage/authority.rs",
    "src/storage/authority_frame.rs",
    "src/storage/backend/session_publication.rs",
    "src/storage/binding_history.rs",
    "src/storage/canonical_hash.rs",
    "src/storage/change_validation.rs",
    "src/storage/derivation_ledger.rs",
    "src/storage/merkle.rs",
    "src/storage/repository/git_snapshot_proof.rs",
    "src/storage/repository/session_publication.rs",
    "src/storage/session_publication.rs",
]

[[excluded]]
reason = "remote and hosted storage: the GCS backend and its envelope compatibility record"
files = [
    "src/storage/gcs.rs",
    "src/storage/gcs_compatibility.rs",
]


