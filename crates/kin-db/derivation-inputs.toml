[dependencies]
kin-model = { decides = ["graph"] }
kin-infer = { reason = "embedding inference engine, used only by embed/, a separate product" }
kin-vector = { reason = "vector index, used only by vector/, a separate product" }
kin-search = { reason = "text index and its tokenizer, a separate product; engine/index.rs tokenizes names only for name-pattern lookups, which no derivation path issues (derivation queries by file and kind)" }
kin-blobs = { reason = "durable fsync helper for storage writes (kin_blobs::durable::sync_all); no derived value" }
serde = { reason = "serialization derive with a fixed data model; a release changes no derived value" }
serde_json = { reason = "JSON, a fixed specification; value-escape records are read as values" }
thiserror = { reason = "error type derive; no derived value" }
parking_lot = { reason = "locks; no derived value" }
hashbrown = { reason = "hash containers with a per-process seeded hasher; derived output is sorted, so it cannot rest on a release's iteration order" }
rustc-hash = { reason = "FxHash containers used only by retrieval.rs, which is excluded" }
uuid = { reason = "UUIDs per RFC 9562; name-based ids are fully specified" }
chrono = { reason = "date and time types with fixed formats; a release changes no derived value" }
hex = { reason = "hex encoding, a fixed specification" }
libc = { reason = "OS and file IO for storage, locking and memory budgeting; no derived value" }
bincode = { reason = "encoding of the CLI read index (storage/index.rs), which is excluded" }
rmp = { reason = "MessagePack, a fixed specification, for persisted snapshots" }
rmp-serde = { reason = "MessagePack, a fixed specification, for persisted snapshots" }
sha2 = { reason = "SHA-256, a fixed specification" }
gix-ignore = { decides = ["graph"] }
bstr = { reason = "byte-string views admission hands to gix-ignore; it wraps the bytes without changing them" }
memmap2 = { reason = "OS and file IO for storage, locking and memory budgeting; no derived value" }
fs2 = { reason = "OS and file IO for storage, locking and memory budgeting; no derived value" }
object_store = { reason = "GCS backend for hosted storage (storage/gcs.rs), excluded" }
tokio = { reason = "GCS backend for hosted storage (storage/gcs.rs), excluded" }
bytes = { reason = "GCS backend for hosted storage (storage/gcs.rs), excluded" }
rusqlite = { reason = "SQLite storage backend (storage/sql.rs), excluded" }
ndarray = { reason = "embeddings product (embed/), excluded; no entity or relation" }
safetensors = { reason = "embeddings product (embed/), excluded; no entity or relation" }
tokenizers = { reason = "embeddings product (embed/), excluded; no entity or relation" }
hf-hub = { reason = "embeddings product (embed/), excluded; no entity or relation" }
directories = { reason = "OS and file IO for storage, locking and memory budgeting; no derived value" }
cap-std = { reason = "OS and file IO for storage, locking and memory budgeting; no derived value" }
cap-fs-ext = { reason = "OS and file IO for storage, locking and memory budgeting; no derived value" }
half = { reason = "declared but not used by this crate's source; no derived value" }
rkyv = { reason = "optional archive feature not used by this crate's source; no derived value" }
rayon = { reason = "parallel iteration; derived results are collected in order or sorted, so scheduling never reaches output" }
sysinfo = { reason = "OS and file IO for storage, locking and memory budgeting; no derived value" }
tempfile = { reason = "OS and file IO for storage, locking and memory budgeting; no derived value" }
tracing = { reason = "logging and spans; no derived value" }
reqwest = { reason = "HTTP client for external embedding providers (embed/external.rs), excluded" }
windows-sys = { reason = "Windows file IO for storage; no derived value" }
