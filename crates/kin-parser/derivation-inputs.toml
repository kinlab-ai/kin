[dependencies]
kin-io = { reason = "filesystem capability dependency retained for explicit IO boundaries; no parser extraction or held-text TODO scan calls it" }
kin-model = { decides = ["graph"] }
tree-sitter = { decides = ["graph"] }
kin-grammar-typescript = { decides = ["graph"] }
tree-sitter-javascript = { decides = ["graph"] }
tree-sitter-python = { decides = ["graph"] }
tree-sitter-go = { decides = ["graph"] }
tree-sitter-java = { decides = ["graph"] }
tree-sitter-rust = { decides = ["graph"] }
tree-sitter-c = { decides = ["graph"] }
tree-sitter-cpp = { decides = ["graph"] }
tree-sitter-c-sharp = { decides = ["graph"] }
tree-sitter-ruby = { decides = ["graph"] }
tree-sitter-php = { decides = ["graph"] }
tree-sitter-swift = { decides = ["graph"] }
tree-sitter-kotlin-ng = { decides = ["graph"] }
tree-sitter-hcl = { decides = ["graph"] }
sha2 = { reason = "SHA-256 as FIPS 180-4 specifies it; a release changes no fingerprint or other derived value" }
thiserror = { reason = "derives Error and Display from the format strings error.rs writes; a release changes no derived value" }
tracing = { reason = "debug logging only; nothing it emits is stored" }
tree-sitter-language = { decides = ["graph"] }
serde = { reason = "serialization with a fixed, specified format; a release changes no derived value" }
serde_json = { reason = "JSON as RFC 8259 specifies it, for metadata values; a release changes no derived value" }
toml = { decides = ["graph"] }  # reads the Cargo manifests a Rust crate root takes its crate name from; a release that accepts another TOML version can change which manifests parse
