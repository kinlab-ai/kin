# Setup scripts carry the test environment below; nextest 0.9.140 still
# gates them behind this flag.
experimental = ["setup-scripts"]

# Test scheduling and flake quarantine.
#
# nextest runs tests in separate processes. Tests that load the default model
# share its HuggingFace cache, whose download lock times out before a cold
# download can finish. Serialize those consumers without retrying failures.
[test-groups.model-download]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary_id(=kin-db) & (test(=embed::tests::default_dimensions_match_default_model) | test(=engine::graph::tests::test_vector_index_dimension_mismatch_auto_recovery) | test(=engine::graph::tests::a_surviving_revision_key_does_not_resolve_a_retired_entity))'
test-group = 'model-download'

[[profile.default.overrides]]
filter = 'binary_id(=kin-db::embed_oom_cpu_fallback) | binary_id(=kin-db::embedding_sanity) | binary_id(=kin-db::embed_hybrid_parity) | binary_id(=kin-db::embed_budget_profile) | binary_id(=kin-db::metal_seq_len_regression) | binary_id(=kin-db::embed_model_card_parity)'
test-group = 'model-download'

# Flake quarantine, and the two verdicts one execution produces.
#
# A job-level retry restarts the check clock, which is what a merge-queue
# ejection costs: four ejections in the 2026-08-26 window, roughly thirty
# minutes each, none of them a code change. A test-level retry costs seconds
# and restarts nothing. This file is where that difference is declared.
#
# Every value below was verified against cargo-nextest 0.9.140 by running it,
# not by reading its help text. The controls are in the report for FIR-2815 and
# in scripts/check-quarantine.py, and the four that matter are:
#
#   retries = 2 + flaky-result = "pass"  -> exit 0, "2 passed (1 flaky)"
#   flaky-result = "fail", same test     -> exit 100, "FLKY-FL"
#   no override at all, same test        -> exit 100, plain FAIL
#   an unknown key anywhere in this file -> a WARNING and exit 0
#
# The last one decides the shape of this file. nextest IGNORES keys it does not
# know, so quarantine bookkeeping cannot live in this table as extra fields: a
# typo would be silently dropped and the row would still read complete. The
# bookkeeping is therefore a comment line in a fixed format above each retry
# override. scripts/check-quarantine.py requires that comment and the filter to
# name the same test. Scheduling-only overrides above do not grant retries.
#
# The blocking verdict is this profile: a quarantined test that passes on retry
# does not fail the run, so it stops ejecting queue entries and stops reddening
# main tips. The reporting verdict is the same execution read the other way,
# out of the JUnit file below, which records every retry as a `flakyFailure`
# element whatever `flaky-result` says. `check-quarantine.py --report-junit`
# is that read. Without it quarantine is a place where flakes go quiet, which is
# the one outcome that would make this file worse than no file.
#
# Entering quarantine takes evidence and nothing else does: the test failed at a
# sha, a SAME-CODE re-run of that job at that exact sha passed, and both run ids
# are on the ticket. A test that fails deterministically cannot enter, because
# its re-run is red too.

[profile.default]
# The blocking verdict. Explicit rather than inherited, because the whole point
# of this file is that a reader can see which way a flake is being graded.
flaky-result = "pass"

# No test may hang a run without bound. A hang is worse than a red test, because
# a red test reports and a hang reports nothing: on 2026-08-28 two kin-spine race
# fixtures deadlocked on a mutex held across a two-party rendezvous, ran 13305
# seconds each, and took the other 112 of that suite's 145 tests down with them,
# so the run said nothing about any of them. The deadlock is fixed; this is the
# property that keeps the next one cheap.
#
# 120s starts the SLOW line, which is a warning and nothing more. Ten of those
# periods terminate the test, so the worst case is twenty minutes rather than
# unbounded. That is deliberately far above any legitimate test here, because
# this value must never be the thing that fails a slow but working test: it is a
# backstop, not a performance budget. Tune it down only with a measurement of
# the slowest passing test in the workspace beside it.
#
# `--slow-timeout` is not a CLI flag on cargo-nextest 0.9.140, verified by
# running it: `error: unexpected argument '--slow-timeout' found`. Config is the
# only place this can be declared, which is also the right place, since it makes
# the bound a property of the repository rather than of whoever remembered a
# flag.
slow-timeout = { period = "120s", terminate-after = 10 }

# The record. Written on every nextest run, including a lane's local one, so the
# reporting verdict never depends on having remembered a flag. Lands at
# target/nextest/default/junit.xml.
[profile.default.junit]
path = "junit.xml"

# The test environment. The setup script gives each run a fresh TMPDIR, so
# stores that fixtures leak cannot slow later runs, and sets KIN_TEST_FLUSH=fsync.
# Debug builds route every sync call through crates/kin-blobs (its `durable` module), which then
# issues a plain fsync instead of F_FULLFSYNC on Apple platforms, in test
# processes and in the kin and kin-daemon processes they start. F_FULLFSYNC
# empties the whole drive cache, costs about 5 ms a file on an Apple SSD, and
# the drive serves roughly 600 a second for the whole machine, so parallel
# store-heavy tests queue behind it. KIN_TEST_FULL_FLUSH=1 keeps real flushes;
# KIN_TEST_SHARED_TMPDIR=1 keeps the inherited TMPDIR. Both accept only 0 or 1.
[scripts.setup.test-env]
command = "scripts/test-env/setup.sh"

[[profile.default.scripts]]
platform = 'cfg(unix)'
filter = "all()"
setup = "test-env"

# Real file-watcher tests on macOS. These 113 kin-daemon tests start the reconcile loop
# with a live macOS FSEvents or inotify watch, and the kin-index watcher tests
# bind one directly. With all 18 test slots running, fseventsd falls behind the
# event rate (measured on macOS only; inotify has shown no such bottleneck) and these tests run out their 10 to 60 s delivery deadlines even
# though they pass on an idle machine. Capping how many run at once keeps their
# event delivery prompt; they still run beside every other test. Keep this list
# identical in open/kin/.config/nextest.toml and tooling/dev/nextest-loop.toml.
[test-groups.real-watcher]
max-threads = 6  # starting cap to qualify, not a measured optimum

